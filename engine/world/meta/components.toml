# Component metadata: the single source for C++ structs, JSON conversion, TypeScript types,
# component docs and the inspector. `pocket gen` regenerates the derived files; they are
# committed so a checkout builds without running the generator first.
#
# Field types: f32 f64 i32 u32 i64 bool vec2 vec3 vec4 quat color entity
# `serialized = false` marks derived data that is never written to scene files.

[[component]]
name = "Transform"
doc = "Position, rotation and scale relative to the parent entity (or the world when there is no parent)."
fields = [
    { name = "position", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Local position in meters." },
    { name = "rotation", type = "quat", default = [0.0, 0.0, 0.0, 1.0], doc = "Local rotation as a unit quaternion (x, y, z, w)." },
    { name = "scale", type = "vec3", default = [1.0, 1.0, 1.0], doc = "Local scale." },
]

[[component]]
name = "WorldTransform"
doc = "World-space transform computed from the Transform hierarchy every tick. Read only."
serialized = false
fields = [
    { name = "position", type = "vec3", default = [0.0, 0.0, 0.0], doc = "World position." },
    { name = "rotation", type = "quat", default = [0.0, 0.0, 0.0, 1.0], doc = "World rotation." },
    { name = "scale", type = "vec3", default = [1.0, 1.0, 1.0], doc = "World scale." },
]

[[component]]
name = "Velocity"
doc = "Linear and angular velocity. The built-in motion system integrates Transform from it every tick."
fields = [
    { name = "linear", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Meters per second, in the parent's space." },
    { name = "angular", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Radians per second around local X, Y, Z." },
]

[[component]]
name = "Health"
doc = "Hit points. Gameplay decides what zero means; the engine only stores and reports it."
fields = [
    { name = "current", type = "f32", default = 100.0, doc = "Current hit points." },
    { name = "max", type = "f32", default = 100.0, doc = "Maximum hit points." },
]

[[component]]
name = "Lifetime"
doc = "Seconds remaining before the entity is destroyed by the lifetime system."
fields = [
    { name = "seconds", type = "f32", default = 1.0, doc = "Remaining seconds; the entity is destroyed when it reaches zero." },
]

[[component]]
name = "Camera"
doc = "The renderer uses the first active camera. Perspective by default; orthographic for 2D (looking down -Z with +Y up is the 2D convention)."
fields = [
    { name = "fov_degrees", type = "f32", default = 60.0, doc = "Vertical field of view in degrees (perspective)." },
    { name = "orthographic", type = "bool", default = false, doc = "Parallel projection: no perspective, sizes do not shrink with distance." },
    { name = "ortho_size", type = "f32", default = 5.0, doc = "Half of the visible height in world units when orthographic." },
    { name = "near", type = "f32", default = 0.1, doc = "Near clip distance." },
    { name = "far", type = "f32", default = 1000.0, doc = "Far clip distance." },
    { name = "active", type = "bool", default = true, doc = "Whether this camera renders." },
]

[[component]]
name = "Light"
doc = "A light source. kind 0 = directional (shines along -Z of the entity), 1 = point, 2 = spot (a cone along -Z of the entity). Any number of point and spot lights (docs/design/rendering.md, Many lights)."
fields = [
    { name = "kind", type = "i32", default = 0, doc = "0 directional, 1 point, 2 spot." },
    { name = "color", type = "color", default = [1.0, 1.0, 1.0, 1.0], doc = "Color as a color picker shows it (sRGB), decoded to linear light; alpha unused." },
    { name = "intensity", type = "f32", default = 1.0, doc = "Multiplier applied to color." },
    { name = "range", type = "f32", default = 10.0, doc = "Point and spot light range in meters: the light fades to nothing there." },
    { name = "inner_angle", type = "f32", default = 20.0, doc = "Spot: the half-angle of the cone in degrees inside which the light is full." },
    { name = "outer_angle", type = "f32", default = 30.0, doc = "Spot: the half-angle in degrees where it has faded out (at most 89.5)." },
    { name = "shadows", type = "bool", default = false, doc = "Point and spot lights: cast shadows. A spot takes one face of the shadow atlas and a point light six (a cube); 64 faces a frame, given to the nearest shadowed lights first. The sun's shadows are render.shadows'." },
]

[[component]]
name = "ReflectionProbe"
doc = "What glossy surfaces inside a box reflect (docs/design/rendering.md, Reflection probes): the scene seen from the entity's position, captured into an environment of its own, in place of the sky's. A room's floor then reflects the room, not the sky outside. Up to eight at once, the first by id where boxes overlap."
fields = [
    { name = "size", type = "vec3", default = [10.0, 4.0, 10.0], doc = "The box it covers, centered on the entity, in world units (not turned with it)." },
    { name = "intensity", type = "f32", default = 1.0, doc = "Multiplies what it reflects." },
    { name = "box_projection", type = "bool", default = true, doc = "Reflect as if the capture lay on the box's walls (a reflection moves right as the eye moves across a room); false treats it as infinitely far, like the sky." },
    { name = "realtime", type = "bool", default = false, doc = "Capture again every frame (six views of the scene each time); otherwise when it appears, moves or changes size, or on render.probes {refresh: true}." },
    { name = "enabled", type = "bool", default = true, doc = "false stops it being used, without removing it." },
]

[[component]]
name = "Fog"
doc = "Air that thickens with distance and thins with height (docs/design/rendering.md, Fog): what is far fades toward the fog's color, a valley fills with it while the hilltops stay clear, and the sky's horizon melts into it. The first enabled one counts."
fields = [
    { name = "color", type = "color", default = [0.7, 0.75, 0.8, 1.0], doc = "The fog's color as a color picker shows it (sRGB); the alpha is unused." },
    { name = "density", type = "f32", default = 0.03, doc = "How thick the fog is at its base height, per unit of distance (0.03: half gone at about 23 units)." },
    { name = "height", type = "f32", default = 0.0, doc = "The height (world Y) where the fog has its density." },
    { name = "falloff", type = "f32", default = 0.2, doc = "How fast it thins going up, per unit of height (0: the same at every height)." },
    { name = "start", type = "f32", default = 0.0, doc = "Distance from the camera before any fog." },
    { name = "max_opacity", type = "f32", default = 1.0, doc = "The most the fog hides, 0..1 (under 1, a far mountain still shows through)." },
    { name = "enabled", type = "bool", default = true, doc = "false turns the fog off without removing it." },
    { name = "volumetric", type = "bool", default = false, doc = "Light the fog (docs/design/rendering.md, Volumetric light): each view ray is marched through it at half resolution, gathering the sun's light through its shadows (shafts where something blocks it) and the point and spot lights' through theirs, instead of fading to the flat color. The color becomes the fog's tint." },
    { name = "anisotropy", type = "f32", default = 0.6, doc = "Volumetric: how much the fog scatters light forward, -0.9..0.9 (0 evenly; toward 0.9 a glow around a light you look toward, as in mist)." },
    { name = "steps", type = "i32", default = 32, doc = "Volumetric: samples along each ray, 4..128." },
    { name = "distance", type = "f32", default = 60.0, doc = "Volumetric: how far along each ray the fog is marched; the sky counts as that far." },
]

[[component]]
name = "Sky"
doc = "The sky around the scene (docs/design/rendering.md, Sky and environment light): drawn behind everything, and the light the scene gets from all around: surfaces are lit by it (diffuse) and glossy ones mirror it (specular), in place of the flat ambient. The first enabled one counts; a 2D game leaves it out."
fields = [
    { name = "mode", type = "i32", default = 1, doc = "1 procedural (a gradient from the zenith to the horizon, a ground below, a glow and a disc where the sun light points), 2 an image (an equirectangular panorama: .hdr for real light levels, or .png/.jpg), 0 off." },
    { name = "image", type = "string", default = "", doc = "For mode 2: project-relative path of the panorama (2:1, the horizon across the middle)." },
    { name = "zenith", type = "color", default = [0.25, 0.45, 0.8, 1.0], doc = "Procedural: the color straight up." },
    { name = "horizon", type = "color", default = [0.75, 0.82, 0.9, 1.0], doc = "Procedural: the color at the horizon." },
    { name = "ground", type = "color", default = [0.33, 0.3, 0.27, 1.0], doc = "Procedural: the color below the horizon." },
    { name = "intensity", type = "f32", default = 1.0, doc = "Brightness of the sky, as seen and as light." },
    { name = "rotation", type = "f32", default = 0.0, doc = "Mode 2: turns the panorama about the vertical axis, in degrees." },
    { name = "sun_size", type = "f32", default = 1.5, doc = "Procedural: angular diameter of the sun's disc in degrees (0 draws none); the disc follows the first directional Light." },
    { name = "diffuse", type = "f32", default = 1.0, doc = "How much the sky lights surfaces (0 leaves only the lights)." },
    { name = "specular", type = "f32", default = 1.0, doc = "How much surfaces reflect the sky (metals and glossy surfaces mirror it by their roughness)." },
    { name = "enabled", type = "bool", default = true, doc = "false turns the sky off without removing it." },
]

[[component]]
name = "MeshRenderer"
doc = "Draws a mesh: a built-in primitive or a glTF file from the project's assets, tinted by a color and optionally textured."
fields = [
    { name = "mesh", type = "string", default = "cube", doc = "cube, sphere, plane, cylinder, quad (unit square in XY facing +Z), capsule (radius 0.5 and 2 tall: a Character's shape at scale 2r, h/2, 2r), or a project-relative glTF path such as assets/crate.glb (all of its nodes, with their own materials)." },
    { name = "node", type = "string", default = "", doc = "Draw one node of the glTF file only (its name, or its index as text; assets.describe lists them as parts), in the entity's own space: world.instantiate {mesh} makes one entity per node with this set, so a file's parts move apart. Empty draws the whole file. Skinned files stay whole." },
    { name = "color", type = "color", default = [0.8, 0.8, 0.8, 1.0], doc = "Base color as a color picker shows it (sRGB, decoded to linear light); multiplies the asset's material color, which glTF stores linear. Alpha under 1 draws the mesh translucent." },
    { name = "texture", type = "string", default = "", doc = "Project-relative image (png, jpg) multiplied into the color; overrides the asset's base color texture. Empty for none." },
    { name = "metallic", type = "f32", default = -1.0, doc = "0 dielectric to 1 metal; negative keeps the asset material's value (0 for primitives)." },
    { name = "roughness", type = "f32", default = -1.0, doc = "0 mirror to 1 matte; negative keeps the asset material's value (1 for primitives)." },
    { name = "emissive", type = "color", default = [0.0, 0.0, 0.0, 1.0], doc = "Light the surface gives off regardless of lighting, added to the asset material's emissive color: sRGB up to 1, and a channel over 1 is an intensity (4 is four times white), which bloom and tone mapping make glow." },
    { name = "cutoff", type = "f32", default = 0.0, doc = "Alpha cutoff: texels of the texture whose alpha is under it are cut out (not drawn, not picked), for leaves, fences and grates from a picture with transparent parts; 0 keeps the asset material's cutoff (glTF alphaMode MASK) or none." },
    { name = "normal_map", type = "string", default = "", doc = "Project-relative tangent-space normal map (+Y up); overrides the asset's. Empty for none." },
    { name = "visible", type = "bool", default = true, doc = "Whether the mesh is drawn." },
    { name = "cast_shadows", type = "bool", default = true, doc = "Whether the mesh casts shadows (the sun's and the lights'); false for a lamp's bulb around its own light, or glass." },
]

[[component]]
name = "Sprite"
doc = "A 2D image: a textured unit square in the entity's XY plane, sized in world units, unlit, alpha blended, drawn after meshes in layer order. Use with an orthographic camera looking down -Z."
fields = [
    { name = "texture", type = "string", default = "", doc = "Project-relative image (png, jpg). Empty draws a solid color." },
    { name = "size", type = "vec2", default = [1.0, 1.0], doc = "Width and height in world units." },
    { name = "color", type = "color", default = [1.0, 1.0, 1.0, 1.0], doc = "Tint and opacity, multiplied into the texture." },
    { name = "anchor", type = "vec2", default = [0.5, 0.5], doc = "Point of the image at the entity's origin: (0,0) bottom-left, (0.5,0.5) center, (1,1) top-right." },
    { name = "layer", type = "i32", default = 0, doc = "Draw order among sprites; higher is drawn later (on top)." },
    { name = "uv", type = "vec4", default = [0.0, 0.0, 1.0, 1.0], doc = "Sub-rectangle of the texture as u0, v0, u1, v1 (0..1, v down), for sprite sheets." },
    { name = "flip_x", type = "bool", default = false, doc = "Mirror horizontally." },
    { name = "flip_y", type = "bool", default = false, doc = "Mirror vertically." },
    { name = "filter", type = "string", default = "linear", doc = "Texture sampling: linear (smooth, and from the mip chain when drawn small) or nearest (crisp pixels from the full-size image, no bleeding between sheet tiles)." },
    { name = "visible", type = "bool", default = true, doc = "Whether the sprite is drawn." },
    { name = "sort_y", type = "bool", default = false, doc = "Within its layer, draw order follows the entity's Y instead of its distance: what is lower on the screen is drawn later (on top), so a top-down scene layers its people and props by where they stand. Set it on every sprite of the layer." },
]

[[component]]
name = "SpriteAnimation"
doc = "Plays a clip (a run of sheet frames registered with sprite.clip or [sprite_clips] in project.toml) on the entity's Sprite: every tick the engine advances time, picks the frame and writes Sprite.uv (and texture when the clip names one). Emits sprite.finished when a non-looping clip ends."
fields = [
    { name = "clip", type = "string", default = "", doc = "Clip name; empty plays nothing." },
    { name = "playing", type = "bool", default = true, doc = "Whether time advances." },
    { name = "loop", type = "bool", default = true, doc = "Wrap at the end (else stop on the last frame and emit sprite.finished); sprite.play takes it from the clip unless told otherwise." },
    { name = "speed", type = "f32", default = 1.0, doc = "Playback rate multiplier; negative plays backwards." },
    { name = "fps", type = "f32", default = 0.0, doc = "Frames per second; 0 uses the clip's rate." },
    { name = "frame", type = "i32", default = 0, doc = "Index into the clip's frame list (read to know where it is, write to jump)." },
    { name = "time", type = "f32", default = 0.0, doc = "Seconds into the current frame; advanced by the engine." },
    { name = "finished", type = "bool", default = false, doc = "Set when a non-looping clip reached its end; cleared by play." },
]

[[component]]
name = "TileMap"
doc = "Draws a Tiled map (a .tmj file in the project) with the entity at the map's top-left corner: tile (x, y) occupies world x from x*tile_size to (x+1)*tile_size and y from -(y+1)*tile_size to -y*tile_size, so rows go down as in Tiled. Every visible tile layer is one static mesh drawn unlit through the sprite path (docs/design/tilemaps.md); tilemap.* commands answer what is where, tilemap.set / tilemap.fill edit the map for every entity drawing it and tilemap.save writes it back."
fields = [
    { name = "map", type = "string", default = "", doc = "Project-relative Tiled JSON map (.tmj)." },
    { name = "layer", type = "string", default = "", doc = "Draw only this tile layer; empty draws every visible one." },
    { name = "tile_size", type = "f32", default = 1.0, doc = "World units per tile." },
    { name = "color", type = "color", default = [1.0, 1.0, 1.0, 1.0], doc = "Tint and opacity over the whole map." },
    { name = "order", type = "i32", default = -10, doc = "Draw order among sprites (Sprite.layer); layers of the map draw in file order on top of this." },
    { name = "visible", type = "bool", default = true, doc = "Whether the map is drawn." },
]

[[record]]
name = "MorphWeight"
doc = "One morph target weight set by script (docs/design/animation.md, Morph targets): the target by name or index, and the weight that replaces the clip's for it."
fields = [
    { name = "target", type = "string", default = "", doc = "Target name from the asset (animation.clips lists them), or its index as a string." },
    { name = "weight", type = "f32", default = 0.0, doc = "0 leaves the vertices where the mesh has them, 1 moves them fully to the target." },
]

[[record]]
name = "IKLimit"
doc = "The bend one joint of an IK chain may have, in degrees, measured between its bone and the bone above it, and, with `side`, the one way it bends (docs/design/animation.md, Inverse kinematics): the chain's `max_bend` is the default for the joints without an entry."
fields = [
    { name = "joint", type = "string", default = "", doc = "The joint's node name." },
    { name = "min_bend", type = "f32", default = 0.0, doc = "The least the joint bends: a knee kept from locking straight. A hinge's may be negative, a few degrees back past straight." },
    { name = "max_bend", type = "f32", default = 180.0, doc = "The most the joint bends." },
    { name = "side", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Set, the joint is a hinge: its bone turns about one axis only, across `side` and the bone above it, and bends toward `side` alone, between min_bend and max_bend; `side` is a direction in the entity's space with the mesh at rest, carried along as the bone above turns. Zero for a joint that bends any way within its cone." },
]

[[record]]
name = "Wheel"
doc = "One wheel of a Vehicle (docs/design/physics.md, Vehicles): where its suspension hangs from the body, how long it is and how big the wheel, whether it steers and whether the engine drives it; the engine writes what it touches and turns."
fields = [
    { name = "offset", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Where the suspension hangs from, in the body's frame (the top of its travel)." },
    { name = "radius", type = "f32", default = 0.35, doc = "The wheel's radius." },
    { name = "rest", type = "f32", default = 0.3, doc = "The suspension's length: how far below `offset` the wheel's centre hangs with nothing under it." },
    { name = "steer", type = "bool", default = false, doc = "Turned by the vehicle's steer." },
    { name = "drive", type = "bool", default = false, doc = "Pushed by the vehicle's throttle." },
    { name = "visual", type = "string", default = "", doc = "The name of an entity under the vehicle that the engine places where the wheel is (its local position), turned with the steering and rolled with the ground (its local rotation): a pivot whose children draw the tyre. Empty for none." },
    { name = "contact", type = "bool", default = false, doc = "On the ground this step (written by the engine)." },
    { name = "compression", type = "f32", default = 0.0, doc = "How far the suspension is pushed in, 0..rest (written by the engine)." },
    { name = "spin", type = "f32", default = 0.0, doc = "How far the wheel has rolled, in radians (written by the engine)." },
]

[[record]]
name = "AnimationLayer"
doc = "One clip layered over an Animator's base clip (docs/design/animation.md): sampled at its own time, limited to the nodes of `mask`, and either blended in at `weight` or added as the clip's change since its first frame. animation.layer adds, updates and removes layers."
fields = [
    { name = "clip", type = "string", default = "", doc = "Clip name from the asset (animation.clips lists them)." },
    { name = "weight", type = "f32", default = 1.0, doc = "0..1: how much of the layer shows (the blend factor, or the scale of an additive change)." },
    { name = "mask", type = "string", default = "", doc = "Node names, comma separated, whose subtrees the layer may move; empty means every node the clip animates." },
    { name = "additive", type = "bool", default = false, doc = "Add the clip's change since its first frame onto the pose so far instead of blending toward the clip." },
    { name = "playing", type = "bool", default = true, doc = "Whether the layer's time advances; animation.stop clears it with the base clip's." },
    { name = "loop", type = "bool", default = true, doc = "Wrap at the end (else stop on the last frame and emit animation.finished with the layer index)." },
    { name = "speed", type = "f32", default = 1.0, doc = "Playback rate multiplier." },
    { name = "time", type = "f32", default = 0.0, doc = "Seconds into the clip; advanced by the engine, writable to seek." },
]

[[component]]
name = "Animator"
doc = "Plays a glTF animation clip of the entity's MeshRenderer asset: every tick the engine advances time, samples the clip's keyframes into the file's node hierarchy and poses the skinned mesh (docs/design/animation.md). Emits animation.finished when a non-looping clip ends. Use animation.play / animation.stop, or set the fields directly."
fields = [
    { name = "clip", type = "string", default = "", doc = "Clip name from the asset (animation.clips lists them); empty plays nothing (bind pose)." },
    { name = "playing", type = "bool", default = true, doc = "Whether time advances." },
    { name = "loop", type = "bool", default = true, doc = "Wrap at the end (else stop on the last frame and emit animation.finished)." },
    { name = "speed", type = "f32", default = 1.0, doc = "Playback rate multiplier." },
    { name = "time", type = "f32", default = 0.0, doc = "Seconds into the clip; advanced by the engine, writable to seek." },
    { name = "finished", type = "bool", default = false, doc = "Set when a non-looping clip reached its end; cleared by play." },
    { name = "fade", type = "f32", default = 0.0, doc = "Seconds of cross-fade from from_clip into clip; animation.play {fade} sets it. 0 when no fade is running." },
    { name = "fade_time", type = "f32", default = 0.0, doc = "Seconds into the cross-fade, advanced by the engine; the blend weight is fade_time / fade, smoothed." },
    { name = "from_clip", type = "string", default = "", doc = "The clip fading out (keeps playing at its own time until the fade ends); empty when none." },
    { name = "from_time", type = "f32", default = 0.0, doc = "Seconds into from_clip, advanced by the engine." },
    { name = "layers", type = "list:AnimationLayer", doc = "Clips layered over the base clip, applied in order after any cross-fade (animation.layer manages them)." },
    { name = "root_motion", type = "i32", default = 0, doc = "0 off; 1 the root node's translation is pinned to the clip's first frame and its change moves the entity's Transform, so a walk cycle carries the character; 2 pins the root and only reports root_delta for the script to apply (docs/design/animation.md, Root motion)." },
    { name = "root", type = "string", default = "", doc = "The node whose translation is the root motion; empty picks the clip's topmost node with a translation track." },
    { name = "root_delta", type = "vec3", default = [0.0, 0.0, 0.0], doc = "The root's translation change this tick while root_motion is on, in the asset's space, or relative to the root's heading when root_rotation is on (written by the engine)." },
    { name = "root_rotation", type = "bool", default = false, doc = "With root_motion on, the root's yaw (its rotation about the asset's +Y) is root motion too: pinned to the clip's first frame in the pose, its change turns the entity (mode 1) or is reported in root_delta_yaw (mode 2), and root_delta is taken relative to the root's heading so a turning walk follows its arc (docs/design/animation.md, Root motion)." },
    { name = "root_delta_yaw", type = "f32", default = 0.0, doc = "The root's yaw change this tick in radians while root_rotation is on (written by the engine)." },
]

[[component]]
name = "IK"
doc = "Inverse kinematics on a chain of the entity's skinned mesh: after the clips and layers pose the skeleton, the `bones` joints that end at node `end` bend so that the effector (`tip` in the end node's space) reaches `target` (world space) or the position of `target_entity`, solved by FABRIK with an optional pole (docs/design/animation.md, Inverse kinematics). Works without an Animator too (over the rest pose). Writes error and reached each tick; animation.pose reports the effector."
fields = [
    { name = "end", type = "string", default = "", doc = "The chain's last node, a joint name (animation.clips lists the skins' joints)." },
    { name = "bones", type = "i32", default = 2, doc = "How many bones the chain has, counted up from `end` (2 for a limb: upper and lower)." },
    { name = "tip", type = "vec3", default = [0.0, 0.0, 0.0], doc = "The effector in the end node's space: the far end of the last bone, e.g. [0, 1, 0] for a unit bone along +Y." },
    { name = "target", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Where the effector should be, in world space (used when target_entity is empty)." },
    { name = "target_entity", type = "string", default = "", doc = "An entity (name or path) whose world position is the target; empty uses target." },
    { name = "pole_entity", type = "string", default = "", doc = "An entity the chain's middle joints bend toward, the knee or elbow hint; empty keeps the bend the pose has." },
    { name = "max_bend", type = "f32", default = 180.0, doc = "The most any joint of the chain may bend, in degrees: the angle between its bone and the bone above it (for the chain's first joint, its parent's bone, or the direction the pose gives the first bone when it has no parent). 180 leaves the bend free; a target the limited chain cannot reach leaves error and reached false." },
    { name = "limits", type = "list:IKLimit", doc = "Per-joint bends, by node name, each with a least and a most, and a hinge's side; joints without an entry take max_bend." },
    { name = "weight", type = "f32", default = 1.0, doc = "How much of the solve applies: 0 the posed chain, 1 the solved one." },
    { name = "iterations", type = "i32", default = 8, doc = "FABRIK passes per tick (each is a backward and a forward sweep)." },
    { name = "tolerance", type = "f32", default = 0.001, doc = "The solve stops once the effector is this close to the target, in meters." },
    { name = "error", type = "f32", default = 0.0, doc = "Distance from the effector to the target after the solve, in meters (written by the engine)." },
    { name = "reached", type = "bool", default = false, doc = "Whether the effector ended within tolerance (written by the engine)." },
    { name = "bend", type = "f32", default = 0.0, doc = "The largest bend among the chain's joints after the solve, in degrees (written by the engine)." },
]

[[component]]
name = "LookAt"
doc = "Aims one node of the entity's skinned mesh at a point after the clips, layers and IK pose it: the node turns so that its `forward` axis points at `target` (world space) or at `target_entity`, at most `max_angle` degrees away from the posed direction, scaled by `weight` (docs/design/animation.md, Look-at). Writes angle each tick."
fields = [
    { name = "node", type = "string", default = "", doc = "The node that turns: a joint, or any node of the asset." },
    { name = "forward", type = "vec3", default = [0.0, 1.0, 0.0], doc = "The node's aiming axis in its own space." },
    { name = "target", type = "vec3", default = [0.0, 0.0, 0.0], doc = "The point to aim at, in world space (used when target_entity is empty)." },
    { name = "target_entity", type = "string", default = "", doc = "An entity (name or path) whose world position is the target; empty uses target." },
    { name = "weight", type = "f32", default = 1.0, doc = "How much of the turn applies: 0 none, 1 the full aim." },
    { name = "max_angle", type = "f32", default = 90.0, doc = "The most the node may turn away from its posed direction, in degrees." },
    { name = "speed", type = "f32", default = 0.0, doc = "How fast the aim may turn, in degrees per second: each tick the aim moves toward the target by at most this much, from where the pose points on the first tick, so a head follows smoothly; 0 aims at once." },
    { name = "angle", type = "f32", default = 0.0, doc = "The turn applied this tick in degrees, after the limit and the weight (written by the engine)." },
    { name = "aim", type = "vec3", default = [0.0, 0.0, 0.0], doc = "The direction the node aims along, in the entity's space, before max_angle and weight (written by the engine; zero until the first tick)." },
]

[[component]]
name = "ParticleEmitter"
doc = "Spawns particles at the entity: small unlit quads (camera-facing billboards, or XY sprites) with a life, a velocity from a cone, gravity, drag, and size and color fading from start to end, landing on a floor, stretched along their motion, and bursting a child emitter where they die (docs/design/particles.md). Simulated by the engine on the fixed tick with a random stream seeded from the entity, so runs are deterministic. particles.burst emits a batch at once; particles.list reads the live ones."
fields = [
    { name = "texture", type = "string", default = "", doc = "Project-relative image; empty draws soft solid quads." },
    { name = "emitting", type = "bool", default = true, doc = "Whether particles spawn continuously at rate." },
    { name = "rate", type = "f32", default = 20.0, doc = "Particles per second while emitting." },
    { name = "max", type = "i32", default = 256, doc = "Most particles alive at once from this emitter (older ones are not replaced; spawning waits)." },
    { name = "lifetime", type = "vec2", default = [1.0, 2.0], doc = "Seconds a particle lives: min and max, drawn uniformly." },
    { name = "speed", type = "vec2", default = [1.0, 2.0], doc = "Initial speed: min and max." },
    { name = "direction", type = "vec3", default = [0.0, 1.0, 0.0], doc = "Center of the emission cone, in the emitter's local frame." },
    { name = "spread", type = "f32", default = 30.0, doc = "Half-angle of the cone in degrees (0 is a beam, 180 is every direction)." },
    { name = "gravity", type = "vec3", default = [0.0, -3.0, 0.0], doc = "Acceleration applied to every particle, world units per second squared." },
    { name = "drag", type = "f32", default = 0.0, doc = "Fraction of velocity lost per second." },
    { name = "size", type = "vec2", default = [0.2, 0.05], doc = "Quad size in world units at birth and at death." },
    { name = "color", type = "color", default = [1.0, 1.0, 1.0, 1.0], doc = "Tint at birth." },
    { name = "color_end", type = "color", default = [1.0, 1.0, 1.0, 0.0], doc = "Tint at death; alpha 0 fades out." },
    { name = "layer", type = "i32", default = 10, doc = "Draw order among sprites and particles." },
    { name = "billboard", type = "bool", default = true, doc = "Face the camera (3D); false keeps quads in the XY plane for 2D scenes." },
    { name = "world_space", type = "bool", default = true, doc = "Particles keep their world position when the emitter moves; false moves them with it." },
    { name = "seed", type = "i32", default = 0, doc = "Extra seed for the emitter's random stream (the entity id seeds it too)." },
    { name = "floor", type = "f32", default = -1000000.0, doc = "A floor the particles land on: the world height (or the emitter's own when world_space is false) below which a particle is put back and bounces with `bounce`; the default is far below anything." },
    { name = "bounce", type = "f32", default = 0.3, doc = "How much of the speed into the floor a particle keeps coming back up; 0 lands it (it slides on with `floor_friction`)." },
    { name = "floor_friction", type = "f32", default = 0.5, doc = "Fraction of the speed along the floor lost per second while a particle rests on it." },
    { name = "stretch", type = "f32", default = 0.0, doc = "Draws each particle stretched along its velocity by this many seconds of travel (rain streaks, sparks); 0 draws a square." },
    { name = "child", type = "entity", default = 0, doc = "An entity with a ParticleEmitter that bursts `child_count` particles where each of this emitter's particles dies (fireworks, a splash); 0 for none." },
    { name = "child_count", type = "i32", default = 8, doc = "Particles the child emits at each death." },
    { name = "collide", type = "bool", default = false, doc = "Particles hit the physics bodies and the solid tiles of orthogonal maps: each tick a ray from where a particle was to where it goes, and on a hit it bounces off the surface with `bounce` of its speed, or rests on it once the bounce is spent and the surface faces up. Costs a ray per particle per tick (docs/design/particles.md)." },
]

[[component]]
name = "Bounds"
doc = "Axis-aligned bounding box in world space, computed by the engine from the mesh and WorldTransform. Read only."
serialized = false
fields = [
    { name = "min", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Minimum corner." },
    { name = "max", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Maximum corner." },
]

[[component]]
name = "RigidBody"
doc = "Physics body. Dynamic bodies fall and collide; static bodies never move; kinematic bodies move by their Velocity and push dynamic ones. Uses the entity's Transform as world space (physics entities should be roots)."
fields = [
    { name = "kind", type = "i32", default = 0, doc = "0 dynamic, 1 static, 2 kinematic." },
    { name = "mass", type = "f32", default = 1.0, doc = "Kilograms; ignored for static bodies." },
    { name = "restitution", type = "f32", default = 0.2, doc = "Bounciness 0..1." },
    { name = "friction", type = "f32", default = 0.5, doc = "Coulomb friction coefficient." },
    { name = "linear_damping", type = "f32", default = 0.01, doc = "Velocity lost per second (fraction)." },
    { name = "angular_damping", type = "f32", default = 0.05, doc = "Angular velocity lost per second (fraction)." },
    { name = "gravity_scale", type = "f32", default = 1.0, doc = "Multiplier on world gravity." },
    { name = "sleeping", type = "bool", default = false, doc = "Set by the engine when the body came to rest; cleared when touched." },
    { name = "lock_rotation", type = "bool", default = false, doc = "Never rotate (characters on capsules stay upright)." },
    { name = "ccd", type = "bool", default = false, doc = "Continuous collision: each step the body is swept along its motion, relative to every shape it may touch (static, kinematic, and dynamic bodies moving too), and stops a skin short of the first impact, so thin walls hold and fast bodies do not cross each other at any speed. A sphere is cast exactly against the other shape; a box or capsule is swept by samples (docs/design/physics.md, Continuous collision). Bodies moving less than half their size per step are not swept." },
]

[[component]]
name = "Joint"
doc = "Connects this body to another body, to any entity as a fixed point, or to a point in the world: a distance joint keeps two anchors a rod's length apart (or a rope's, pulling only; with stiffness it is a spring), a ball joint pins them together while both rotate freely, a hinge pins them and allows rotation about one axis only, a slider lets the body move along one axis only, each with optional limits and a motor (docs/design/physics.md, Joints). Solved with the contacts every tick; when the force carried exceeds break_force the joint breaks (joint.broken event, component removed)."
fields = [
    { name = "kind", type = "i32", default = 0, doc = "0 distance (rod, or rope when rope is set, or spring when stiffness is set), 1 ball (anchors pinned together), 2 hinge (pinned, turning about axis only), 3 slider (prismatic: moving along axis only, no rotation relative to the target)." },
    { name = "target", type = "string", default = "", doc = "Path or name of the other entity (a body, or any entity as an immovable point); empty pins to the world point target_anchor." },
    { name = "anchor", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Attachment point on this body, in its local frame." },
    { name = "target_anchor", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Attachment point on the target in its local frame, or a world point when there is no target." },
    { name = "distance", type = "f32", default = -1.0, doc = "Rest length of a distance joint; negative takes the anchors' distance at the first step and writes it here." },
    { name = "rope", type = "bool", default = false, doc = "Distance joints only: pull when the anchors are farther than distance, never push." },
    { name = "stiffness", type = "f32", default = 0.0, doc = "Distance joints: newtons per meter of stretch; above 0 the rod is a spring (a bungee with rope) instead of a rigid length." },
    { name = "damping", type = "f32", default = 0.0, doc = "Springs: newton-seconds per meter, the drag on the stretch speed." },
    { name = "break_force", type = "f32", default = 0.0, doc = "Force (newtons) above which the joint breaks; 0 never breaks." },
    { name = "force", type = "f32", default = 0.0, doc = "Force the joint carried in the last step, written by the engine." },
    { name = "axis", type = "vec3", default = [0.0, 0.0, 1.0], doc = "Hinge: the axis of rotation; slider: the axis of travel. In this body's local frame." },
    { name = "target_axis", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Hinge and slider: the axis in the target's frame; zero takes the body's axis at the first step and writes it here." },
    { name = "reference", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Hinge and slider: a direction across the axis in the target's frame from which the turn is measured; zero takes it at the first step and writes it here." },
    { name = "limit", type = "bool", default = false, doc = "Hinge: keep angle between lower and upper (equal values lock the hinge). Slider: keep translation between them." },
    { name = "lower", type = "f32", default = -1.5708, doc = "Lower limit, when limit is set: radians for a hinge, meters along the axis for a slider." },
    { name = "upper", type = "f32", default = 1.5708, doc = "Upper limit, when limit is set: radians for a hinge, meters along the axis for a slider." },
    { name = "motor_speed", type = "f32", default = 0.0, doc = "The speed the motor drives the body to relative to the target: radians per second about a hinge's axis, meters per second along a slider's." },
    { name = "motor_torque", type = "f32", default = 0.0, doc = "Hinge: the most torque the motor applies; 0 turns the motor off." },
    { name = "motor_force", type = "f32", default = 0.0, doc = "Slider: the most force the motor applies along the axis; 0 turns the motor off." },
    { name = "angle", type = "f32", default = 0.0, doc = "Hinge: the body's rotation about the axis relative to the target, in radians, written by the engine every step." },
    { name = "translation", type = "f32", default = 0.0, doc = "Slider: how far this body's anchor sits along the axis from the target's anchor, in meters, written by the engine every step." },
    { name = "speed", type = "f32", default = 0.0, doc = "The body's speed relative to the target, written by the engine every step: radians per second about a hinge's axis, meters per second along a slider's." },
    { name = "collide_connected", type = "bool", default = true, doc = "Whether this body and the joint's target body collide with each other; false lets a ragdoll's limbs or a chain's links overlap where the joint holds them." },
]

[[component]]
name = "Body2D"
doc = "A 2D platformer body: an axis-aligned box in the XY plane that falls under gravity and is stopped by the solid tiles of a TileMap and by kinematic bodies (docs/design/tilemaps.md, 2D physics). Every tick the engine adds gravity, carries the body with the platform it rides, moves along X then Y, resolves against solid cells (one-way tiles only from above), walks slopes and steps, writes Transform.position and the contact flags, and emits body2d.landed. A kinematic body moves by its velocity alone and is a platform for the others. Scripts steer by writing velocity."
fields = [
    { name = "velocity", type = "vec2", default = [0.0, 0.0], doc = "Units per second, relative to what carries the body (a platform or a body it rides); scripts set x from input and y for a jump, the engine adds gravity and zeroes what a tile stops." },
    { name = "gravity", type = "f32", default = -24.0, doc = "Units per second squared along Y (negative is down)." },
    { name = "max_fall", type = "f32", default = 30.0, doc = "Fastest downward speed." },
    { name = "size", type = "vec2", default = [0.4, 0.5], doc = "Half extents of the box." },
    { name = "offset", type = "vec2", default = [0.0, 0.0], doc = "Box center relative to the entity's position." },
    { name = "map", type = "string", default = "", doc = "Path or name of the TileMap entity to collide with; empty takes the first one." },
    { name = "grounded", type = "bool", default = false, doc = "Standing on a solid tile (written by the engine)." },
    { name = "on_wall", type = "i32", default = 0, doc = "-1 touching a wall on the left, 1 on the right, 0 none (written by the engine)." },
    { name = "on_ceiling", type = "bool", default = false, doc = "Head against a tile (written by the engine)." },
    { name = "kinematic", type = "bool", default = false, doc = "Moves by its velocity only (no gravity, no tiles) and is a solid platform for the other bodies, which ride it while standing on it." },
    { name = "one_way", type = "bool", default = false, doc = "Kinematic bodies: catch bodies from above only (a lift that rises through the floor)." },
    { name = "step", type = "f32", default = 0.5, doc = "The height a grounded body climbs over a solid edge without jumping, and drops without leaving the ground (stairs, the top and the foot of a slope)." },
    { name = "riding", type = "entity", default = 0, doc = "The body this one stands on and moves with, a platform or another dynamic body; 0 when none (written by the engine)." },
    { name = "on_slope", type = "i32", default = 0, doc = "1 standing on a floor rising to the right, -1 rising to the left, 0 flat or in the air (written by the engine)." },
    { name = "mass", type = "f32", default = 1.0, doc = "Weight against other dynamic bodies: two that overlap sideways each give way by the other's share of the mass and exchange their speeds into each other as a collision of the two masses, so a sliding crate takes the one it hits along and a heavy crate barely moves when a light body runs into it (docs/design/tilemaps.md, Bodies against bodies)." },
    { name = "collide_bodies", type = "bool", default = true, doc = "Whether this body is pushed apart from, stands on and carries other dynamic bodies; false passes through them (ghosts, pickups with a body)." },
    { name = "restitution", type = "f32", default = 0.0, doc = "Bounciness 0..1: the speed kept, reversed, when the body hits a floor, a ceiling, a wall, a platform or another body (a ball at 0.7 bounces to half its height; between two bodies the larger restitution counts, and momentum is kept); 0 stops dead. A landing slower than half a unit per second lands instead of bouncing, and body2d.bounced reports each bounce (docs/design/tilemaps.md, Friction and restitution)." },
    { name = "friction", type = "f32", default = 0.0, doc = "Ground friction in units per second squared: how fast a grounded body's sideways speed (relative to what carries it) falls toward zero once nothing drives it, so a shoved crate slides to a stop; 0 slides forever. Applied after the move, so a script that writes velocity.x every tick is not slowed." },
]

[[component]]
name = "Character"
doc = "A 3D character: an upright capsule centred on the entity that walks, climbs steps and slopes, stands on moving platforms and slides along walls, moved by the engine every tick after the rigid bodies (docs/design/physics.md, Characters). Scripts set velocity.x and z from input and velocity.y for a jump; the engine adds gravity, stops the capsule at every collider (static, kinematic and dynamic, triggers aside), and writes back where it stands. Give the entity a kinematic RigidBody and a capsule Collider of the same size too when rigid bodies should bump into it and triggers and raycasts should see it; the character passes over its own collider."
fields = [
    { name = "velocity", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Units per second, relative to the platform it stands on; the engine adds gravity to y, zeroes y on landing and under a ceiling, and takes out the part that runs into a wall." },
    { name = "gravity", type = "f32", default = -20.0, doc = "Units per second squared along Y (negative is down)." },
    { name = "max_fall", type = "f32", default = 50.0, doc = "Fastest downward speed." },
    { name = "radius", type = "f32", default = 0.3, doc = "The capsule's radius." },
    { name = "height", type = "f32", default = 1.8, doc = "The capsule's whole height, round ends included; the entity is at its centre, so a character standing on the ground at y 0 is at y = height / 2." },
    { name = "step", type = "f32", default = 0.3, doc = "The tallest edge a grounded character walks up without a jump (stairs, kerbs), and how far it follows the ground down (the far side of a slope, going down stairs) without leaving it." },
    { name = "max_slope", type = "f32", default = 45.0, doc = "The steepest floor, in degrees, the character stands and walks on; steeper ground is a wall it slides down." },
    { name = "push", type = "f32", default = 1.0, doc = "How much of its speed into a dynamic body the character gives it (0 leaves bodies alone, 1 pushes them along at its own speed)." },
    { name = "mask", type = "u32", default = 4294967295, doc = "Bits of the collision layers (Collider.layer) the character is stopped by; all by default." },
    { name = "grounded", type = "bool", default = false, doc = "Standing on a floor no steeper than max_slope (written by the engine)." },
    { name = "ground_normal", type = "vec3", default = [0.0, 1.0, 0.0], doc = "The floor's normal where it stands (written by the engine)." },
    { name = "ground", type = "entity", default = 0, doc = "The collider it stands on; 0 in the air (written by the engine)." },
    { name = "on_wall", type = "bool", default = false, doc = "Stopped by a wall or too-steep ground this tick (written by the engine)." },
    { name = "wall_normal", type = "vec3", default = [0.0, 0.0, 0.0], doc = "That wall's normal (written by the engine)." },
    { name = "on_ceiling", type = "bool", default = false, doc = "Its head hit something this tick (written by the engine)." },
    { name = "stepped", type = "bool", default = false, doc = "Walked up an edge this tick (written by the engine)." },
]

[[component]]
name = "Terrain"
doc = "Ground shaped by a height field (docs/design/terrain.md): a grid of heights across size.x by size.y (x by z) centred on the entity, from a greyscale heightmap image or from fractal noise, drawn with the entity's MeshRenderer (grass, rock on the slopes, snow up high) and collided with as a mesh by a Collider of shape 3; characters walk it, nav.bake maps it, and terrain.sculpt reshapes it."
fields = [
    { name = "size", type = "vec2", default = [64.0, 64.0], doc = "The extent along x and z, centred on the entity." },
    { name = "height", type = "f32", default = 8.0, doc = "The height range: a heightmap's white, or the noise's highest point, is this high above the entity." },
    { name = "resolution", type = "i32", default = 129, doc = "Samples along each side (2 to 1025): the grid has resolution - 1 cells across." },
    { name = "heightmap", type = "string", default = "", doc = "A project-relative greyscale PNG (8 or 16 bits), black at 0 and white at `height`, its top row at -z; empty makes the heights from noise (seed, scale, octaves). terrain.save writes one." },
    { name = "seed", type = "u32", default = 1, doc = "The noise's seed: the same seed, scale and octaves give the same hills." },
    { name = "scale", type = "f32", default = 24.0, doc = "The size of the noise's largest features, in units." },
    { name = "octaves", type = "i32", default = 4, doc = "Layers of noise, each twice as fine and half as tall as the one before (1 to 10)." },
    { name = "grass", type = "color", default = [0.30, 0.45, 0.22, 1.0], doc = "The colour of flat and gentle ground." },
    { name = "rock", type = "color", default = [0.45, 0.42, 0.38, 1.0], doc = "The colour of ground steeper than rock_slope." },
    { name = "snow", type = "color", default = [0.92, 0.93, 0.95, 1.0], doc = "The colour above snow_line." },
    { name = "rock_slope", type = "f32", default = 35.0, doc = "Degrees from level above which ground is rock." },
    { name = "snow_line", type = "f32", default = 0.85, doc = "The fraction of `height` above which ground is snow; 1 or more for none." },
    { name = "texture_tile", type = "f32", default = 4.0, doc = "Units per repeat of the MeshRenderer's texture over the ground." },
]

[[component]]
name = "Scatter"
doc = "Many copies of the entity's MeshRenderer strewn over the ground below it (docs/design/terrain.md, Scattering): grass, stones, flowers. From `seed`, `count` places are tried across `area` around the entity; each is dropped onto the static colliders under it (only `on`'s when set) and kept when the ground there is no steeper than max_slope, within min_height..max_height and at least `spacing` from the others; each gets a turn, a size and a shade of its own. The copies are drawn (and cast shadows) but are not entities and do not collide. Placed again when these settings, the entity's position or a terrain change."
fields = [
    { name = "count", type = "i32", default = 500, doc = "Places tried (the most copies there can be; up to 20000)." },
    { name = "area", type = "vec2", default = [32.0, 32.0], doc = "The extent along x and z, centred on the entity." },
    { name = "seed", type = "u32", default = 1, doc = "The same seed and settings place the same copies." },
    { name = "on", type = "string", default = "", doc = "Path or name of the entity whose collider the copies stand on (a terrain); empty takes any static collider." },
    { name = "scale", type = "vec2", default = [0.8, 1.2], doc = "The smallest and largest size, times the entity's scale." },
    { name = "yaw", type = "f32", default = 360.0, doc = "Degrees of random turn about the vertical (0 keeps them all facing one way)." },
    { name = "align", type = "f32", default = 0.0, doc = "How far each copy leans with the ground under it: 0 upright, 1 square to the slope." },
    { name = "sink", type = "f32", default = 0.0, doc = "Units each copy is set into the ground (a stone half buried)." },
    { name = "spacing", type = "f32", default = 0.0, doc = "The least distance between two copies; 0 lets them crowd." },
    { name = "max_slope", type = "f32", default = 35.0, doc = "Degrees: no copy where the ground is steeper." },
    { name = "min_height", type = "f32", default = -1000.0, doc = "No copy on ground lower than this (world y): above the water line." },
    { name = "max_height", type = "f32", default = 1000.0, doc = "No copy on ground higher than this (world y): below the snow." },
    { name = "shade", type = "f32", default = 0.15, doc = "How much each copy's brightness varies, 0..1." },
    { name = "placed", type = "i32", default = 0, doc = "How many copies stand (written by the engine)." },
]

[[component]]
name = "Vehicle"
doc = "A car on raycast wheels (docs/design/physics.md, Vehicles): on a dynamic RigidBody with a Collider, each Wheel's suspension is a spring cast down from its mount; wheels on the ground push the body up, drive it by `throttle`, turn it by `steer`, slow it by `brake` and keep it from sliding sideways by `grip`. Scripts set the controls; the engine writes speed and the wheels."
fields = [
    { name = "wheels", type = "list:Wheel", doc = "The wheels, each with its mount, suspension and role." },
    { name = "throttle", type = "f32", default = 0.0, doc = "-1..1: forward drive at 1, reverse at -1." },
    { name = "steer", type = "f32", default = 0.0, doc = "-1..1: the steering wheels turn left at -1 and right at 1, by max_steer degrees." },
    { name = "brake", type = "f32", default = 0.0, doc = "0..1: how hard every wheel on the ground brakes." },
    { name = "power", type = "f32", default = 10.0, doc = "The acceleration full throttle gives on level ground, units per second squared." },
    { name = "top_speed", type = "f32", default = 25.0, doc = "The speed at which the engine stops pushing, units per second." },
    { name = "braking", type = "f32", default = 18.0, doc = "The deceleration a full brake gives, units per second squared." },
    { name = "max_steer", type = "f32", default = 30.0, doc = "Degrees the steering wheels turn at full steer." },
    { name = "grip", type = "f32", default = 1.4, doc = "How much sideways force the tyres can hold, as a multiple of the load on them: above what the turn asks, the car slides." },
    { name = "suspension_hz", type = "f32", default = 2.2, doc = "How stiff the springs are, as the bounce's frequency with the body's weight on them." },
    { name = "damping", type = "f32", default = 0.45, doc = "How fast a bounce dies: 0 bounces on, 1 settles without overshoot." },
    { name = "roll_resistance", type = "f32", default = 0.3, doc = "Units per second squared the wheels lose to rolling when nothing drives or brakes them." },
    { name = "speed", type = "f32", default = 0.0, doc = "Forward speed, negative backing up (written by the engine)." },
    { name = "grounded", type = "i32", default = 0, doc = "Wheels on the ground (written by the engine)." },
]

[[component]]
name = "TopDown2D"
doc = "A top-down 2D mover on a tile map of any orientation (orthogonal, isometric, staggered, hexagonal; docs/design/tilemaps.md, Top-down bodies): a point with a radius in the XY plane that moves by its velocity, no gravity, and is stopped by the map's solid cells: the move is tried along X then along Y in steps no longer than the radius, so thin walls hold, and a step whose cell ahead is solid is dropped. Scripts set the velocity from input; the engine writes what was blocked and the cell under the center. Not for the same entity as a Body2D (both move the transform)."
fields = [
    { name = "velocity", type = "vec2", default = [0.0, 0.0], doc = "Units per second along X and Y." },
    { name = "radius", type = "f32", default = 0.3, doc = "How far ahead of the center, along the move, the cell must be open (the body's half width)." },
    { name = "map", type = "string", default = "", doc = "Path or name of the TileMap entity to collide with; empty takes the first one." },
    { name = "blocked_x", type = "bool", default = false, doc = "The X move was stopped by a solid cell this tick (written by the engine)." },
    { name = "blocked_y", type = "bool", default = false, doc = "The Y move was stopped by a solid cell this tick (written by the engine)." },
    { name = "tile_x", type = "i32", default = -1, doc = "The map cell under the center, -1 outside the map (written by the engine)." },
    { name = "tile_y", type = "i32", default = -1, doc = "The map cell under the center, -1 outside the map (written by the engine)." },
]

[[component]]
name = "Collider"
doc = "Collision shape centered on the entity (plus offset). Box half extents come from size; spheres use size.x as radius. Triggers report overlaps but do not push."
fields = [
    { name = "shape", type = "i32", default = 0, doc = "0 box, 1 sphere, 2 capsule (a segment along local Y with round ends), 3 mesh (the triangles of a glTF asset, scaled by the Transform; for level geometry, mesh colliders do not collide with each other)." },
    { name = "size", type = "vec3", default = [0.5, 0.5, 0.5], doc = "Box half extents; radius in x for spheres; radius in x and half length of the straight part in y for capsules." },
    { name = "offset", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Local offset of the shape center." },
    { name = "is_trigger", type = "bool", default = false, doc = "Overlap events only, no collision response." },
    { name = "mesh", type = "string", default = "", doc = "For shape 3: the glTF file whose triangles collide (project-relative path); empty uses the entity's MeshRenderer mesh." },
    { name = "layer", type = "u32", default = 1, doc = "Bits of the layers this shape is on (bit 0 by default); [physics] layers in project.toml names them and physics.layers lists them." },
    { name = "mask", type = "u32", default = 4294967295, doc = "Bits of the layers this shape collides with (all by default). Two shapes collide, touch as a trigger, or answer a query only when each is on a layer the other's mask includes." },
    { name = "group", type = "i32", default = 0, doc = "Collision group: two shapes in the same negative group never collide, in the same positive group always collide, whatever their layers; 0 leaves it to the layers (docs/design/physics.md, Groups and exceptions)." },
]

[[component]]
name = "AudioSource"
doc = "A sound attached to an entity: the engine starts it when autoplay is set (once, when the component appears or the scene loads) and keeps `playing` and `voice` current. Scripts use audio.play for one-shots."
fields = [
    { name = "clip", type = "string", default = "", doc = "Project-relative WAV path such as assets/hum.wav." },
    { name = "volume", type = "f32", default = 1.0, doc = "Linear gain, 0..4." },
    { name = "pitch", type = "f32", default = 1.0, doc = "Playback rate multiplier." },
    { name = "lowpass", type = "f32", default = 1.0, doc = "How much of the high end is kept when the voice starts, 0..1: 1 is the clip as it is, small values muffle it (underwater, behind a door); audio.set {lowpass} changes a playing voice." },
    { name = "reverb", type = "f32", default = 1.0, doc = "How much of the voice goes to the room's reverb (audio.reverb), 0..1: 0 keeps it dry whatever the room." },
    { name = "bus", type = "string", default = "main", doc = "The bus the voice plays on (music, effects, dialogue: any name): a bus is set as one with audio.bus, its volume, a mute, a low-pass and ducking under another bus (docs/design/audio.md, Buses)." },
    { name = "loop", type = "bool", default = false, doc = "Restart when the clip ends." },
    { name = "autoplay", type = "bool", default = false, doc = "Start playing as soon as the component exists." },
    { name = "spatial", type = "bool", default = false, doc = "Heard from where the entity is: the volume falls from full within `near` of the listener (an enabled AudioListener entity, else the camera) to nothing at `range`, and the sound pans to the side the entity is on (docs/design/audio.md, Where a sound is)." },
    { name = "near", type = "f32", default = 1.0, doc = "Distance within which a spatial source plays at its full volume." },
    { name = "range", type = "f32", default = 20.0, doc = "Distance at which a spatial source is silent." },
    { name = "occlusion", type = "f32", default = 0.0, doc = "How much a wall in the way takes from a spatial source, 0..1: above 0, each tick a ray runs from the listener to the entity, and a collider of another entity across it (not a trigger, not the listener's own) scales the volume by 1 - occlusion and cuts the voice's high end to `lowpass` times the same, so a sound behind a door is quieter and muffled (docs/design/audio.md, Where a sound is)." },
    { name = "doppler", type = "f32", default = 1.0, doc = "How strongly a spatial source's pitch follows its motion toward or away from the listener, and the listener's own (the Doppler effect, sound at 343 m/s): 1 as in air, 0 keeps the pitch; the change is held between half and twice the pitch." },
    { name = "occluded", type = "bool", default = false, doc = "Whether a collider stands between the listener and this source right now (written by the engine when `occlusion` is above 0; `audio.occluded` is emitted when it changes)." },
    { name = "playing", type = "bool", default = false, doc = "Whether a voice is currently playing this source (written by the engine)." },
    { name = "voice", type = "u32", default = 0, doc = "Id of the playing voice, 0 when silent (written by the engine)." },
]

[[component]]
name = "AudioListener"
doc = "Where spatial sounds are heard from: the entity's world position and facing stand in for the camera's while it is enabled (the first enabled one by entity id when there are several). Put it on the player of a third-person game so sounds are placed around the player, not the camera."
fields = [
    { name = "enabled", type = "bool", default = true, doc = "Whether this listener is the one; disabled, the camera listens again." },
]

[[component]]
name = "NavObstacle"
doc = "A moving thing paths go around (docs/design/navigation.md, Obstacles): every tick, before the agents move, the engine blocks the navigation cells within radius (plus the grid's agent radius) of the entity's position, so nav.path, nav.reachable, nav.nearest and the agents route around it without a new bake. Carts, crates, doors."
fields = [
    { name = "radius", type = "f32", default = 0.5, doc = "Radius of the blocked disc around the entity, in the grid's plane." },
    { name = "enabled", type = "bool", default = true, doc = "false lifts the obstacle without removing the component." },
]

[[component]]
name = "NavAgent"
doc = "A thing that walks the navigation grid on its own (docs/design/navigation.md, Agents): every tick, after the scripts and the physics, the engine plans a path to its goal around the obstacles, heads for the next corner, picks the velocity that keeps it clear of the other agents and the obstacles, and moves the entity (Velocity.linear when it has a Velocity, else Transform.position). Scripts set mode, goal or target, speed and radius and read state; nav.arrived and nav.stuck are emitted on the transitions."
fields = [
    { name = "mode", type = "i32", default = 0, doc = "0 idle (the engine leaves the entity alone), 1 walk to goal, 2 follow target, 3 keep a slot beside target: the point `offset` from the leader in the leader's heading, matched in speed so a group walks as one (docs/design/navigation.md, Formations)." },
    { name = "goal", type = "vec3", default = [0.0, 0.0, 0.0], doc = "The point to reach in mode 1." },
    { name = "target", type = "entity", default = 0, doc = "The entity to follow in mode 2, or the leader whose slot to keep in mode 3." },
    { name = "offset", type = "vec3", default = [0.0, 0.0, 0.0], doc = "In mode 3, the slot relative to the leader: x along the leader's heading (negative is behind it), z (y on an XY grid) to its right. The heading is the way the leader last moved; until it moves, the world axes." },
    { name = "speed", type = "f32", default = 3.0, doc = "Top speed, units per second." },
    { name = "radius", type = "f32", default = 0.35, doc = "The agent's radius for keeping clear of other agents and obstacles." },
    { name = "arrive", type = "f32", default = 0.3, doc = "Distance from the goal at which the agent stops (state 2)." },
    { name = "replan", type = "i32", default = 10, doc = "Ticks between path replans; a goal that moved by half a cell or a corner that got blocked replans at once." },
    { name = "avoidance", type = "f32", default = 1.0, doc = "Weight of the local avoidance against the desired velocity; 0 walks the path regardless of the others." },
    { name = "queue", type = "f32", default = 0.0, doc = "How much the agent prefers slowing down behind an agent ahead that goes its way (or stands) over passing it: 0 passes when it can, 1 keeps to a line; agents with the same goal then form a queue instead of a ring. Crossing and oncoming agents are still avoided by turning." },
    { name = "priority", type = "i32", default = 0, doc = "Agents with a lower priority get out of this one's way: its avoidance ignores them while theirs avoids it." },
    { name = "state", type = "i32", default = 0, doc = "0 idle, 1 moving, 2 arrived, 3 stuck: the goal cannot be reached or the target is gone (written by the engine)." },
    { name = "velocity", type = "vec3", default = [0.0, 0.0, 0.0], doc = "The velocity chosen this tick (written by the engine)." },
    { name = "corner", type = "vec3", default = [0.0, 0.0, 0.0], doc = "The point the agent is heading for: the next corner of its path, or the goal (written by the engine)." },
    { name = "distance", type = "f32", default = 0.0, doc = "Length of the remaining path (written by the engine)." },
    { name = "neighbours", type = "i32", default = 0, doc = "Agents and obstacles the avoidance considered this tick (written by the engine)." },
    { name = "queued", type = "bool", default = false, doc = "Whether the agent slowed down behind an agent ahead this tick (written by the engine)." },
]

[[component]]
name = "Morph"
doc = "Morph target weights set by script, over the ones the clip plays (docs/design/animation.md, Morph targets): every entry replaces the weight of its target for the entity's mesh asset; targets not listed keep the clip's or the file's default. animation.morph edits the list by name."
fields = [
    { name = "weights", type = "list:MorphWeight", doc = "The targets and their weights." },
]

