# Component metadata: the single source for C++ structs, JSON conversion, TypeScript types,
# component docs and the inspector. `pocket gen` regenerates the derived files; they are
# committed so a checkout builds without running the generator first.
#
# Field types: f32 f64 i32 u32 i64 bool vec2 vec3 vec4 quat color entity
# `serialized = false` marks derived data that is never written to scene files.

[[component]]
name = "Transform"
doc = "Position, rotation and scale relative to the parent entity (or the world when there is no parent)."
fields = [
    { name = "position", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Local position in meters." },
    { name = "rotation", type = "quat", default = [0.0, 0.0, 0.0, 1.0], doc = "Local rotation as a unit quaternion (x, y, z, w)." },
    { name = "scale", type = "vec3", default = [1.0, 1.0, 1.0], doc = "Local scale." },
]

[[component]]
name = "WorldTransform"
doc = "World-space transform computed from the Transform hierarchy every tick. Read only."
serialized = false
fields = [
    { name = "position", type = "vec3", default = [0.0, 0.0, 0.0], doc = "World position." },
    { name = "rotation", type = "quat", default = [0.0, 0.0, 0.0, 1.0], doc = "World rotation." },
    { name = "scale", type = "vec3", default = [1.0, 1.0, 1.0], doc = "World scale." },
]

[[component]]
name = "Velocity"
doc = "Linear and angular velocity. The built-in motion system integrates Transform from it every tick."
fields = [
    { name = "linear", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Meters per second, in the parent's space." },
    { name = "angular", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Radians per second around local X, Y, Z." },
]

[[component]]
name = "Health"
doc = "Hit points. Gameplay decides what zero means; the engine only stores and reports it."
fields = [
    { name = "current", type = "f32", default = 100.0, doc = "Current hit points." },
    { name = "max", type = "f32", default = 100.0, doc = "Maximum hit points." },
]

[[component]]
name = "Lifetime"
doc = "Seconds remaining before the entity is destroyed by the lifetime system."
fields = [
    { name = "seconds", type = "f32", default = 1.0, doc = "Remaining seconds; the entity is destroyed when it reaches zero." },
]

[[component]]
name = "Camera"
doc = "The renderer uses the first active camera. Perspective by default; orthographic for 2D (looking down -Z with +Y up is the 2D convention)."
fields = [
    { name = "fov_degrees", type = "f32", default = 60.0, doc = "Vertical field of view in degrees (perspective)." },
    { name = "orthographic", type = "bool", default = false, doc = "Parallel projection: no perspective, sizes do not shrink with distance." },
    { name = "ortho_size", type = "f32", default = 5.0, doc = "Half of the visible height in world units when orthographic." },
    { name = "near", type = "f32", default = 0.1, doc = "Near clip distance." },
    { name = "far", type = "f32", default = 1000.0, doc = "Far clip distance." },
    { name = "active", type = "bool", default = true, doc = "Whether this camera renders." },
]

[[component]]
name = "Light"
doc = "A light source. kind 0 = directional (shines along -Z of the entity), 1 = point."
fields = [
    { name = "kind", type = "i32", default = 0, doc = "0 directional, 1 point." },
    { name = "color", type = "color", default = [1.0, 1.0, 1.0, 1.0], doc = "Linear RGB color; alpha unused." },
    { name = "intensity", type = "f32", default = 1.0, doc = "Multiplier applied to color." },
    { name = "range", type = "f32", default = 10.0, doc = "Point light range in meters." },
]

[[component]]
name = "MeshRenderer"
doc = "Draws a mesh: a built-in primitive or a glTF file from the project's assets, tinted by a color and optionally textured."
fields = [
    { name = "mesh", type = "string", default = "cube", doc = "cube, sphere, plane, cylinder, quad (unit square in XY facing +Z), or a project-relative glTF path such as assets/crate.glb (all of its nodes, with their own materials)." },
    { name = "color", type = "color", default = [0.8, 0.8, 0.8, 1.0], doc = "Base color, linear RGB; multiplies the asset's material color." },
    { name = "texture", type = "string", default = "", doc = "Project-relative image (png, jpg) multiplied into the color; overrides the asset's base color texture. Empty for none." },
    { name = "visible", type = "bool", default = true, doc = "Whether the mesh is drawn." },
]

[[component]]
name = "Sprite"
doc = "A 2D image: a textured unit square in the entity's XY plane, sized in world units, unlit, alpha blended, drawn after meshes in layer order. Use with an orthographic camera looking down -Z."
fields = [
    { name = "texture", type = "string", default = "", doc = "Project-relative image (png, jpg). Empty draws a solid color." },
    { name = "size", type = "vec2", default = [1.0, 1.0], doc = "Width and height in world units." },
    { name = "color", type = "color", default = [1.0, 1.0, 1.0, 1.0], doc = "Tint and opacity, multiplied into the texture." },
    { name = "anchor", type = "vec2", default = [0.5, 0.5], doc = "Point of the image at the entity's origin: (0,0) bottom-left, (0.5,0.5) center, (1,1) top-right." },
    { name = "layer", type = "i32", default = 0, doc = "Draw order among sprites; higher is drawn later (on top)." },
    { name = "uv", type = "vec4", default = [0.0, 0.0, 1.0, 1.0], doc = "Sub-rectangle of the texture as u0, v0, u1, v1 (0..1, v down), for sprite sheets." },
    { name = "flip_x", type = "bool", default = false, doc = "Mirror horizontally." },
    { name = "flip_y", type = "bool", default = false, doc = "Mirror vertically." },
    { name = "filter", type = "string", default = "linear", doc = "Texture sampling: linear (smooth) or nearest (crisp pixels, no bleeding between sheet tiles)." },
    { name = "visible", type = "bool", default = true, doc = "Whether the sprite is drawn." },
]

[[component]]
name = "Bounds"
doc = "Axis-aligned bounding box in world space, computed by the engine from the mesh and WorldTransform. Read only."
serialized = false
fields = [
    { name = "min", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Minimum corner." },
    { name = "max", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Maximum corner." },
]

[[component]]
name = "RigidBody"
doc = "Physics body. Dynamic bodies fall and collide; static bodies never move; kinematic bodies move by their Velocity and push dynamic ones. Uses the entity's Transform as world space (physics entities should be roots)."
fields = [
    { name = "kind", type = "i32", default = 0, doc = "0 dynamic, 1 static, 2 kinematic." },
    { name = "mass", type = "f32", default = 1.0, doc = "Kilograms; ignored for static bodies." },
    { name = "restitution", type = "f32", default = 0.2, doc = "Bounciness 0..1." },
    { name = "friction", type = "f32", default = 0.5, doc = "Coulomb friction coefficient." },
    { name = "linear_damping", type = "f32", default = 0.01, doc = "Velocity lost per second (fraction)." },
    { name = "angular_damping", type = "f32", default = 0.05, doc = "Angular velocity lost per second (fraction)." },
    { name = "gravity_scale", type = "f32", default = 1.0, doc = "Multiplier on world gravity." },
    { name = "sleeping", type = "bool", default = false, doc = "Set by the engine when the body came to rest; cleared when touched." },
]

[[component]]
name = "Collider"
doc = "Collision shape centered on the entity (plus offset). Box half extents come from size; spheres use size.x as radius. Triggers report overlaps but do not push."
fields = [
    { name = "shape", type = "i32", default = 0, doc = "0 box, 1 sphere." },
    { name = "size", type = "vec3", default = [0.5, 0.5, 0.5], doc = "Box half extents, or radius in x for spheres." },
    { name = "offset", type = "vec3", default = [0.0, 0.0, 0.0], doc = "Local offset of the shape center." },
    { name = "is_trigger", type = "bool", default = false, doc = "Overlap events only, no collision response." },
]

[[component]]
name = "AudioSource"
doc = "A sound attached to an entity: the engine starts it when autoplay is set (once, when the component appears or the scene loads) and keeps `playing` and `voice` current. Scripts use audio.play for one-shots."
fields = [
    { name = "clip", type = "string", default = "", doc = "Project-relative WAV path such as assets/hum.wav." },
    { name = "volume", type = "f32", default = 1.0, doc = "Linear gain, 0..4." },
    { name = "pitch", type = "f32", default = 1.0, doc = "Playback rate multiplier." },
    { name = "loop", type = "bool", default = false, doc = "Restart when the clip ends." },
    { name = "autoplay", type = "bool", default = false, doc = "Start playing as soon as the component exists." },
    { name = "playing", type = "bool", default = false, doc = "Whether a voice is currently playing this source (written by the engine)." },
    { name = "voice", type = "u32", default = 0, doc = "Id of the playing voice, 0 when silent (written by the engine)." },
]
