[workspace]
resolver = "3"
members = ["shared/contract/rust", "crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
pocket-contract = { path = "shared/contract/rust" }
pocket-sim = { path = "crates/pocket-sim" }
pocket-persist = { path = "crates/pocket-persist" }
pocket-link = { path = "crates/pocket-link" }
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
libm = "=0.2.16"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
schemars = "=1.2.2"
strsim = "=0.11.1"
serde-reflection = "=0.6.0"
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }
blake3 = "=1.8.7"
arc-swap = "=1.9.2"
toml = "=1.1.6"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = "line-tables-only"
panic = "unwind"

[profile.web]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.release.package.pocket-sim]
overflow-checks = true
[profile.web.package.pocket-sim]
overflow-checks = true
