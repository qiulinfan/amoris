name = "talk"
entry = "scripts/main.ts"

[window]
title = "Pocket: talk"
width = 960
height = 540

# Actions instead of keys; agents hold them by name (docs/design/input.md).
[input.actions]
move_x = { negative = ["A", "Left"], positive = ["D", "Right"], axis = ["pad:leftx"] }
move_y = { negative = ["S", "Down"], positive = ["W", "Up"], axis = ["pad:lefty"] }
talk = ["E", "pad:a"]
