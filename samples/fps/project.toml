name = "fps"
entry = "scripts/main.tsx"
scene = "scene.json"

[window]
title = "Pocket: fps"
width = 960
height = 540

# Actions instead of keys; agents hold them by name (docs/design/input.md). The mouse looks and the
# right stick looks, as two pairs: a mouse's motion is pixels this tick, a stick's a rate.
[input.actions]
move_x = { negative = ["A", "Left", "pad:dpad_left"], positive = ["D", "Right", "pad:dpad_right"], axis = ["pad:leftx"] }
move_z = { negative = ["W", "Up", "pad:dpad_up"], positive = ["S", "Down", "pad:dpad_down"], axis = ["pad:lefty"] }
look_x = { axis = ["mouse:x"], deadzone = 0 }
look_y = { axis = ["mouse:y"], deadzone = 0 }
stick_x = { axis = ["pad:rightx"] }
stick_y = { axis = ["pad:righty"] }
fire = ["mouse:left", "F", "pad:right_trigger"]
reload = ["R", "pad:x"]
jump = ["Space", "pad:a"]

[render]
msaa = 4
ao = true
bloom = true
shadow_softness = 1.0

[render.tonemap]
operator = "agx"
