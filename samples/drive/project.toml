name = "drive"
entry = "scripts/main.ts"
scene = "scene.json"

[window]
title = "Pocket: drive"
width = 960
height = 540

[input.actions]
steer = { negative = ["A", "Left"], positive = ["D", "Right"], axis = ["pad:leftx"] }
throttle = { negative = ["S", "Down", "pad:left_trigger"], positive = ["W", "Up", "pad:right_trigger"] }
brake = ["Space", "pad:a"]

[render]
ao = true
