name = "topdown"
entry = "scripts/main.tsx"
scene = "scene.json"

[window]
title = "Pocket: topdown"
width = 960
height = 540

# Actions instead of keys; agents hold them by name (docs/design/input.md). The mouse aims at the
# ground under the pointer; the arrow keys or the right stick aim by direction instead.
[input.actions]
move_x = { negative = ["A", "pad:dpad_left"], positive = ["D", "pad:dpad_right"], axis = ["pad:leftx"] }
move_z = { negative = ["W", "pad:dpad_up"], positive = ["S", "pad:dpad_down"], axis = ["pad:lefty"] }
aim_x = { negative = ["Left"], positive = ["Right"], axis = ["pad:rightx"] }
aim_z = { negative = ["Up"], positive = ["Down"], axis = ["pad:righty"] }
fire = ["mouse:left", "Space", "pad:right_trigger"]

[render]
msaa = 4
ao = true
bloom = true
shadow_softness = 1.0
toon = { outline = 1.5 }

[render.tonemap]
operator = "agx"
