# The playground's own components (docs/decisions/0007-project-components.md). What a chaser is,
# kept on the entity instead of in a script Map, so world.query, the world hash, saves, the
# recorder and the editor's inspector all see it.

[[component]]
name = "Enemy"
doc = "A chaser: what it does to the player on a hit and where it came from."
fields = [
    { name = "damage", type = "f32", default = 10.0, doc = "Health a hit takes from the player." },
    { name = "kind", type = "i32", default = 0, enum = ["grunt", "brute"], doc = "0 grunt, 1 brute (slower, hits twice as hard)." },
    { name = "spawn_seq", type = "i64", default = 0, doc = "The event that made it: its hits name it as their cause (events.why)." },
    { name = "spawn_tick", type = "i64", default = 0, doc = "The tick it came." },
]
