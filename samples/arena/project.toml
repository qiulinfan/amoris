name = "arena"
entry = "scripts/main.ts"
scene = "scene.json"

[window]
title = "Pocket: arena"
width = 960
height = 540

# The same actions for every player: in a lockstep game (docs/design/networking.md) each peer's
# keys are its own player's.
[input.actions]
move_x = { negative = ["A", "Left", "pad:dpad_left"], positive = ["D", "Right", "pad:dpad_right"], axis = ["pad:leftx"] }
move_z = { negative = ["W", "Up", "pad:dpad_up"], positive = ["S", "Down", "pad:dpad_down"], axis = ["pad:lefty"] }
