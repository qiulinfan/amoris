name = "dungeon"
entry = "scripts/main.ts"

[window]
title = "Pocket: dungeon"
width = 960
height = 540

# Actions instead of keys; agents hold them by name (docs/design/input.md).
[input.actions]
move_x = { negative = ["A", "Left", "pad:dpad_left"], positive = ["D", "Right", "pad:dpad_right"], axis = ["pad:leftx"] }
move_y = { negative = ["S", "Down", "pad:dpad_down"], positive = ["W", "Up", "pad:dpad_up"], axis = ["pad:lefty"] }

# Dark between the lights: the flat light every lit sprite and map gets (docs/design/sprites.md, Light).
[render]
ambient = { color = "#3a4060", intensity = 0.35 }
bloom = true
