# The Rapier side of the physics benchmark (docs/bench/physics.md). A standalone package, not a
# workspace member: each solver configuration is a feature set, and inside the engine workspace
# Cargo would unify them with pocket-physics' `enhanced-determinism`.
[package]
name = "physics-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[dependencies]
# The engine's pin (Cargo.toml at the repository root). Default features are dim3, f32 and std.
rapier3d = { version = "=0.36.0" }
# Scene construction math (the terrain's sin and cos) must not depend on the platform's libm, or
# the native and wasm32 runs would not build the same scene (numeric rule of the physics spike).
libm = "=0.2.16"
rayon = { version = "=1.12.0", optional = true }
# The engine's snapshot encoding of the solver (crates/pocket-physics/src/cache.rs), for --fork-at.
bincode = { version = "=1.3.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "=0.2.190"             # the calling thread's CPU time (main.rs, thread_cpu_ms)

[features]
# The configuration aipocket2 ships (crates/pocket-physics): cross-platform deterministic.
det = ["rapier3d/enhanced-determinism"]
# 8-lane SIMD for the solver (refuses to compile together with `det`).
simd8 = ["rapier3d/simd8"]
# Rayon-parallel pipeline (islands, narrow phase, solver).
parallel = ["rapier3d/parallel", "dep:rayon"]
# --fork-at: snapshot the PhysicsWorld through serde and bincode as pocket-physics does, restore it
# into a second world and step both (the engine ships with `serde-serialize`).
serde = ["rapier3d/serde-serialize", "dep:bincode"]

[profile.release]            # the engine's release profile (Cargo.toml at the repository root)
opt-level = 3
lto = false
codegen-units = 16
debug = "line-tables-only"
panic = "unwind"

[profile.release-lto]        # the best a native build can do: whole-program optimization
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.web]                # the engine's shipped browser profile (Cargo.toml at the repository root)
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
debug = false
