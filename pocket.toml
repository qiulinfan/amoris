# Pocket workspace manifest. `pocket` (tools/pocket) reads this file, discovers module.toml
# files under module_dirs, fetches dependencies into .pocket/deps, generates build/<config>/build.ninja
# and drives Ninja. Every command supports --json.

[workspace]
name = "pocket"
version = "0.0.1"
module_dirs = ["engine", "third_party", "tests", "tools"]

[toolchain]
cxx_standard = "c++26"
warnings = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-missing-field-initializers"]
# No fused multiply-adds: a lockstep game's peers (docs/design/networking.md) must compute the same
# floats, and a wasm build has no FMA while an arm64 one would fuse a * b + c.
cxx_flags = ["-fvisibility=hidden", "-ffp-contract=off"]
c_flags = ["-ffp-contract=off"]
defines = ["POCKET_VERSION_MAJOR=0", "POCKET_VERSION_MINOR=0", "POCKET_VERSION_PATCH=1"]
macos_deployment_target = "14.0"

[configs.debug]
cxx_flags = ["-O0", "-g", "-fno-omit-frame-pointer", "-fsanitize=address,undefined"]
c_flags = ["-O0", "-g", "-fno-omit-frame-pointer", "-fsanitize=address,undefined"]
defines = ["POCKET_DEBUG=1"]
link_flags = ["-fsanitize=address,undefined"]

[configs.release]
cxx_flags = ["-O2", "-g"]
c_flags = ["-O2", "-g"]
defines = ["NDEBUG=1"]
link_flags = []

# The web build (docs/web.md): Emscripten, SDL3 and WebGPU from its ports, scripts on the
# browser's own JavaScript engine, assets from a packaged virtual file system.
[configs.wasm]
target = "wasm"
warnings = ["-Wall", "-Wextra", "-Wno-unused-parameter", "-Wno-missing-field-initializers"]
cxx_flags = ["-O2", "-fno-exceptions", "--use-port=sdl3", "--use-port=emdawnwebgpu"]
c_flags = ["-O2", "-msimd128", "-msse2", "--use-port=sdl3"]
defines = ["NDEBUG=1", "POCKET_WEB=1"]
link_flags = ["-O2", "--use-port=sdl3", "--use-port=emdawnwebgpu", "-sALLOW_MEMORY_GROWTH=1", "-sINITIAL_MEMORY=134217728", "-sSTACK_SIZE=4194304", "-sASYNCIFY=1", "-sASYNCIFY_STACK_SIZE=131072", "-sFORCE_FILESYSTEM=1", "-lidbfs.js", "-lwebsocket.js", "-sEXPORTED_RUNTIME_METHODS=ccall,cwrap,UTF8ToString,stringToNewUTF8,FS,FS_createPath,FS_createDataFile,FS_createPreloadedFile,addRunDependency,removeRunDependency,HEAPF32,HEAPF64,HEAPU32,HEAPU8", "-sEXPORTED_FUNCTIONS=_main,_malloc,_free,_pocket_command,_pocket_command_async", "-sENVIRONMENT=web", "-sNO_EXIT_RUNTIME=1"]

# The same runtime with JavaScript Promise Integration instead of Asyncify: no instrumented code, so
# a smaller and faster module, for browsers that have JSPI (Chrome; docs/web.md). `pocket pack <name>
# --web --config wasm-jspi`.
[configs.wasm-jspi]
target = "wasm"
warnings = ["-Wall", "-Wextra", "-Wno-unused-parameter", "-Wno-missing-field-initializers"]
cxx_flags = ["-O2", "-fno-exceptions", "--use-port=sdl3", "--use-port=emdawnwebgpu"]
c_flags = ["-O2", "-msimd128", "-msse2", "--use-port=sdl3"]
defines = ["NDEBUG=1", "POCKET_WEB=1"]
link_flags = ["-O2", "--use-port=sdl3", "--use-port=emdawnwebgpu", "-sALLOW_MEMORY_GROWTH=1", "-sINITIAL_MEMORY=134217728", "-sSTACK_SIZE=4194304", "-sJSPI=1", "-sJSPI_EXPORTS=main,pocket_command_async", "-sFORCE_FILESYSTEM=1", "-lidbfs.js", "-lwebsocket.js", "-sEXPORTED_RUNTIME_METHODS=ccall,cwrap,UTF8ToString,stringToNewUTF8,FS,FS_createPath,FS_createDataFile,FS_createPreloadedFile,addRunDependency,removeRunDependency,HEAPF32,HEAPF64,HEAPU32,HEAPU8", "-sEXPORTED_FUNCTIONS=_main,_malloc,_free,_pocket_command,_pocket_command_async", "-sENVIRONMENT=web", "-sNO_EXIT_RUNTIME=1"]

# The smallest runtime: JSPI at -Oz with link-time optimization, a fifth smaller than wasm-jspi and
# about two fifths slower at stepping the simulation (docs/web.md, Costs). `pocket pack <name> --web --config wasm-small`.
[configs.wasm-small]
target = "wasm"
warnings = ["-Wall", "-Wextra", "-Wno-unused-parameter", "-Wno-missing-field-initializers"]
cxx_flags = ["-Oz", "-flto", "-fno-exceptions", "--use-port=sdl3", "--use-port=emdawnwebgpu"]
c_flags = ["-Oz", "-flto", "-msimd128", "-msse2", "--use-port=sdl3"]
defines = ["NDEBUG=1", "POCKET_WEB=1"]
link_flags = ["-Oz", "-flto", "--use-port=sdl3", "--use-port=emdawnwebgpu", "-sALLOW_MEMORY_GROWTH=1", "-sINITIAL_MEMORY=134217728", "-sSTACK_SIZE=4194304", "-sJSPI=1", "-sJSPI_EXPORTS=main,pocket_command_async", "-sFORCE_FILESYSTEM=1", "-lidbfs.js", "-lwebsocket.js", "-sEXPORTED_RUNTIME_METHODS=ccall,cwrap,UTF8ToString,stringToNewUTF8,FS,FS_createPath,FS_createDataFile,FS_createPreloadedFile,addRunDependency,removeRunDependency,HEAPF32,HEAPF64,HEAPU32,HEAPU8", "-sEXPORTED_FUNCTIONS=_main,_malloc,_free,_pocket_command,_pocket_command_async", "-sENVIRONMENT=web", "-sNO_EXIT_RUNTIME=1"]

# The iOS Simulator (docs/build-system.md, iOS): Xcode's clang and the simulator SDK, arm64, iOS 17
# and later. `pocket setup --target ios-sim`, then `pocket pack <name> --ios` makes the app and
# `pocket run <name> --ios` runs it in a simulator.
[configs.ios-sim]
target = "ios-sim"
cxx_flags = ["-O2", "-g"]
c_flags = ["-O2", "-g"]
defines = ["NDEBUG=1", "POCKET_IOS=1"]
link_flags = []

[[dependencies]]
name = "sdl3"
version = "3.4.16"
kind = "cmake"
url = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz"
sha256 = "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68"
cmake_args = ["-DSDL_STATIC=ON", "-DSDL_SHARED=OFF", "-DSDL_TESTS=OFF", "-DSDL_EXAMPLES=OFF", "-DSDL_TEST_LIBRARY=OFF", "-DSDL_INSTALL_DOCS=OFF"]
include_dirs = ["include"]
libs = ["lib/libSDL3.a"]
wasm = "port"
frameworks = ["CoreMedia", "CoreVideo", "Cocoa", "IOKit", "ForceFeedback", "Carbon", "CoreAudio", "AudioToolbox", "AVFoundation", "Foundation", "GameController", "Metal", "QuartzCore"]
weak_frameworks = ["UniformTypeIdentifiers", "CoreHaptics"]
link_flags = ["-lpthread", "-lm"]
license = "Zlib"

[dependencies.platforms.ios]
cmake_args = ["-DSDL_STATIC=ON", "-DSDL_SHARED=OFF", "-DSDL_TESTS=OFF", "-DSDL_EXAMPLES=OFF", "-DSDL_TEST_LIBRARY=OFF", "-DSDL_INSTALL_DOCS=OFF", "-DSDL_OPENGLES=OFF", "-DSDL_OPENGL=OFF"]
frameworks = ["UIKit", "CoreMedia", "CoreVideo", "CoreAudio", "AudioToolbox", "AVFoundation", "Foundation", "GameController", "Metal", "QuartzCore", "CoreGraphics", "CoreMotion", "CoreBluetooth"]

[[dependencies]]
name = "wgpu"
version = "29.0.1.1"
kind = "prebuilt"
url = "https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-macos-aarch64-release.zip"
sha256 = "a5797a37b1adf720bcd5dcffb291edbbd5b7b14be0a3874c28e6393a655a7a3e"
strip_components = 0
include_dirs = ["include"]
libs = ["lib/libwgpu_native.a"]
wasm = "port"
frameworks = ["Metal", "QuartzCore", "CoreFoundation", "Foundation", "CoreGraphics", "IOKit", "IOSurface", "AppKit"]
license = "MIT OR Apache-2.0"

[dependencies.platforms.ios-sim]
url = "https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-ios-aarch64-simulator-release.zip"
sha256 = "750e706765bef3744313745194774d095c916fc21d2a0e7d4d7b0bc4d0c92789"
frameworks = ["Metal", "QuartzCore", "CoreFoundation", "Foundation", "CoreGraphics", "IOSurface", "UIKit"]

[dependencies.platforms.linux-aarch64]
url = "https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-aarch64-release.zip"
sha256 = "015fcdf1dbae82e614a783cc38017e5399ae0927a889fe9b69c9b664bc61b47a"

[dependencies.platforms.linux-x86_64]
url = "https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-linux-x86_64-release.zip"
sha256 = "95a4d90c071005a98d03eab348beaa6b07e16eb00d1dcdb9f8348f75eb97ec5a"

[[dependencies]]
name = "libwebp"
version = "1.6.0"
kind = "cmake"
url = "https://github.com/webmproject/libwebp/archive/refs/tags/v1.6.0.tar.gz"
sha256 = "93a852c2b3efafee3723efd4636de855b46f9fe1efddd607e1f42f60fc8f2136"
# The decoder alone (WebP images and glTF's EXT_texture_webp), without the tools or threads.
cmake_args = ["-DBUILD_SHARED_LIBS=OFF", "-DWEBP_BUILD_ANIM_UTILS=OFF", "-DWEBP_BUILD_CWEBP=OFF", "-DWEBP_BUILD_DWEBP=OFF", "-DWEBP_BUILD_GIF2WEBP=OFF", "-DWEBP_BUILD_IMG2WEBP=OFF", "-DWEBP_BUILD_VWEBP=OFF", "-DWEBP_BUILD_WEBPINFO=OFF", "-DWEBP_BUILD_LIBWEBPMUX=OFF", "-DWEBP_BUILD_WEBPMUX=OFF", "-DWEBP_BUILD_EXTRAS=OFF", "-DWEBP_USE_THREAD=OFF"]
include_dirs = ["include"]
libs = ["lib/libwebpdecoder.a"]
license = "BSD-3-Clause"

[[dependencies]]
name = "draco"
version = "1.5.7"
kind = "cmake"
url = "https://github.com/google/draco/archive/refs/tags/1.5.7.tar.gz"
sha256 = "bf6b105b79223eab2b86795363dfe5e5356050006a96521477973aba8f036fe1"
# Draco-compressed glTF meshes (KHR_draco_mesh_compression): the bitstream glTF uses, no tools.
cmake_args = ["-DBUILD_SHARED_LIBS=OFF", "-DDRACO_GLTF_BITSTREAM=ON", "-DDRACO_TESTS=OFF", "-DDRACO_JS_GLUE=OFF", "-DDRACO_TRANSCODER_SUPPORTED=OFF"]
include_dirs = ["include"]
libs = ["lib/libdraco.a"]
license = "Apache-2.0"

[[dependencies]]
name = "freetype"
version = "2.14.3"
kind = "cmake"
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz"
sha256 = "36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f"
cmake_args = ["-DBUILD_SHARED_LIBS=OFF", "-DFT_DISABLE_ZLIB=ON", "-DFT_DISABLE_BZIP2=ON", "-DFT_DISABLE_PNG=ON", "-DFT_DISABLE_HARFBUZZ=ON", "-DFT_DISABLE_BROTLI=ON", "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"]
include_dirs = ["include/freetype2"]
libs = ["lib/libfreetype.a"]
license = "FTL"

[[dependencies]]
name = "harfbuzz"
version = "12.3.0"
kind = "cmake"
url = "https://github.com/harfbuzz/harfbuzz/releases/download/12.3.0/harfbuzz-12.3.0.tar.xz"
sha256 = "8660ebd3c27d9407fc8433b5d172bafba5f0317cb0bb4339f28e5370c93d42b7"
cmake_args = ["-DBUILD_SHARED_LIBS=OFF", "-DHB_HAVE_FREETYPE=OFF", "-DHB_HAVE_GLIB=OFF", "-DHB_HAVE_ICU=OFF", "-DHB_HAVE_CORETEXT=OFF", "-DHB_BUILD_SUBSET=OFF", "-DHB_BUILD_UTILS=OFF", "-DHB_BUILD_TESTS=OFF", "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"]
include_dirs = ["include/harfbuzz"]
libs = ["lib/libharfbuzz.a"]
license = "MIT"

# The TypeScript compiler (TypeScript 7, native) for `pocket check`: not linked, only run.
[[dependencies]]
name = "typescript"
version = "7.0.2"
kind = "prebuilt"
url = "https://registry.npmjs.org/@typescript/typescript-darwin-arm64/-/typescript-darwin-arm64-7.0.2.tgz"
sha256 = "902e2fe1cf0799198ef902c6b8c310a450fef629a6baba41d45641ef75c04ebd"
strip_components = 1
wasm = "skip"
license = "Apache-2.0"

[dependencies.platforms.linux-aarch64]
url = "https://registry.npmjs.org/@typescript/typescript-linux-arm64/-/typescript-linux-arm64-7.0.2.tgz"
sha256 = "c83d931ac9dd7549cde6e71246aa9d6a9812843023df3e277fe3b5dcf41dd0ea"

[dependencies.platforms.linux-x86_64]
url = "https://registry.npmjs.org/@typescript/typescript-linux-x64/-/typescript-linux-x64-7.0.2.tgz"
sha256 = "7ecad6f67377e831856367ab062ef394f21506a611405bf8ac0ff039348637d3"

# A tool on the host, not part of a game.
[dependencies.platforms.ios]
kind = "skip"

[[dependencies]]
name = "noto-sans-arabic"
version = "2.010"
kind = "file"
url = "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSansArabic/full/ttf/NotoSansArabic-Regular.ttf"
sha256 = "7ed3fe069312aceac454f17cf613a30f95271d6ed7ce58005ed4d016bd3823d7"
license = "OFL-1.1"

[[dependencies]]
name = "noto-sans-cjk"
version = "2.004"
kind = "file"
url = "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
sha256 = "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b"
license = "OFL-1.1"

[[dependencies]]
name = "javascriptcore"
version = "system"
kind = "system"
frameworks = ["JavaScriptCore"]
license = "Apple system framework"

# On Linux, WebKitGTK's JavaScriptCore with the same C API (4.1: 6.0 keeps only the GObject one):
# apt install libjavascriptcoregtk-4.1-dev.
[dependencies.platforms.linux]
pkg_config = ["javascriptcoregtk-4.1"]
