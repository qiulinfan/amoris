# Pocket workspace manifest. `pocket` (tools/pocket) reads this file, discovers module.toml
# files under module_dirs, fetches dependencies into .pocket/deps, generates build/<config>/build.ninja
# and drives Ninja. Every command supports --json.

[workspace]
name = "pocket"
version = "0.0.1"
module_dirs = ["engine", "third_party", "tests", "tools"]

[toolchain]
cxx_standard = "c++26"
warnings = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-missing-field-initializers"]
cxx_flags = ["-fvisibility=hidden"]
c_flags = []
defines = ["POCKET_VERSION_MAJOR=0", "POCKET_VERSION_MINOR=0", "POCKET_VERSION_PATCH=1"]
macos_deployment_target = "14.0"

[configs.debug]
cxx_flags = ["-O0", "-g", "-fno-omit-frame-pointer", "-fsanitize=address,undefined"]
c_flags = ["-O0", "-g", "-fno-omit-frame-pointer", "-fsanitize=address,undefined"]
defines = ["POCKET_DEBUG=1"]
link_flags = ["-fsanitize=address,undefined"]

[configs.release]
cxx_flags = ["-O2", "-g"]
c_flags = ["-O2", "-g"]
defines = ["NDEBUG=1"]
link_flags = []

[[dependencies]]
name = "sdl3"
version = "3.4.16"
kind = "cmake"
url = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz"
sha256 = "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68"
cmake_args = ["-DSDL_STATIC=ON", "-DSDL_SHARED=OFF", "-DSDL_TESTS=OFF", "-DSDL_EXAMPLES=OFF", "-DSDL_TEST_LIBRARY=OFF", "-DSDL_INSTALL_DOCS=OFF"]
include_dirs = ["include"]
libs = ["lib/libSDL3.a"]
frameworks = ["CoreMedia", "CoreVideo", "Cocoa", "IOKit", "ForceFeedback", "Carbon", "CoreAudio", "AudioToolbox", "AVFoundation", "Foundation", "GameController", "Metal", "QuartzCore"]
weak_frameworks = ["UniformTypeIdentifiers", "CoreHaptics"]
link_flags = ["-lpthread", "-lm"]
license = "Zlib"

[[dependencies]]
name = "wgpu"
version = "29.0.1.1"
kind = "prebuilt"
url = "https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-macos-aarch64-release.zip"
sha256 = "a5797a37b1adf720bcd5dcffb291edbbd5b7b14be0a3874c28e6393a655a7a3e"
strip_components = 0
include_dirs = ["include"]
libs = ["lib/libwgpu_native.a"]
frameworks = ["Metal", "QuartzCore", "CoreFoundation", "Foundation", "CoreGraphics", "IOKit", "IOSurface", "AppKit"]
license = "MIT OR Apache-2.0"

[[dependencies]]
name = "freetype"
version = "2.14.3"
kind = "cmake"
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz"
sha256 = "36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f"
cmake_args = ["-DBUILD_SHARED_LIBS=OFF", "-DFT_DISABLE_ZLIB=ON", "-DFT_DISABLE_BZIP2=ON", "-DFT_DISABLE_PNG=ON", "-DFT_DISABLE_HARFBUZZ=ON", "-DFT_DISABLE_BROTLI=ON", "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"]
include_dirs = ["include/freetype2"]
libs = ["lib/libfreetype.a"]
license = "FTL"

[[dependencies]]
name = "harfbuzz"
version = "12.3.0"
kind = "cmake"
url = "https://github.com/harfbuzz/harfbuzz/releases/download/12.3.0/harfbuzz-12.3.0.tar.xz"
sha256 = "8660ebd3c27d9407fc8433b5d172bafba5f0317cb0bb4339f28e5370c93d42b7"
cmake_args = ["-DBUILD_SHARED_LIBS=OFF", "-DHB_HAVE_FREETYPE=OFF", "-DHB_HAVE_GLIB=OFF", "-DHB_HAVE_ICU=OFF", "-DHB_HAVE_CORETEXT=OFF", "-DHB_BUILD_SUBSET=OFF", "-DHB_BUILD_UTILS=OFF", "-DHB_BUILD_TESTS=OFF", "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"]
include_dirs = ["include/harfbuzz"]
libs = ["lib/libharfbuzz.a"]
license = "MIT"

[[dependencies]]
name = "noto-sans-arabic"
version = "2.010"
kind = "file"
url = "https://raw.githubusercontent.com/notofonts/notofonts.github.io/main/fonts/NotoSansArabic/full/ttf/NotoSansArabic-Regular.ttf"
sha256 = "7ed3fe069312aceac454f17cf613a30f95271d6ed7ce58005ed4d016bd3823d7"
license = "OFL-1.1"

[[dependencies]]
name = "noto-sans-cjk"
version = "2.004"
kind = "file"
url = "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
sha256 = "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b"
license = "OFL-1.1"

[[dependencies]]
name = "javascriptcore"
version = "system"
kind = "system"
frameworks = ["JavaScriptCore"]
license = "Apple system framework"
