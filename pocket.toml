# Pocket workspace manifest. `pocket` (tools/pocket) reads this file, discovers module.toml
# files under module_dirs, fetches dependencies into .pocket/deps, generates build/<config>/build.ninja
# and drives Ninja. Every command supports --json.

[workspace]
name = "pocket"
version = "0.0.1"
module_dirs = ["engine", "third_party", "tests", "tools"]

[toolchain]
cxx_standard = "c++26"
warnings = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-missing-field-initializers"]
cxx_flags = ["-fvisibility=hidden"]
c_flags = []
defines = ["POCKET_VERSION_MAJOR=0", "POCKET_VERSION_MINOR=0", "POCKET_VERSION_PATCH=1"]
macos_deployment_target = "14.0"

[configs.debug]
cxx_flags = ["-O0", "-g", "-fno-omit-frame-pointer", "-fsanitize=address,undefined"]
c_flags = ["-O0", "-g", "-fno-omit-frame-pointer", "-fsanitize=address,undefined"]
defines = ["POCKET_DEBUG=1"]
link_flags = ["-fsanitize=address,undefined"]

[configs.release]
cxx_flags = ["-O2", "-g"]
c_flags = ["-O2", "-g"]
defines = ["NDEBUG=1"]
link_flags = []

# The web build (docs/web.md): Emscripten, SDL3 and WebGPU from its ports, scripts on the
# browser's own JavaScript engine, assets from a packaged virtual file system.
[configs.wasm]
target = "wasm"
warnings = ["-Wall", "-Wextra", "-Wno-unused-parameter", "-Wno-missing-field-initializers"]
cxx_flags = ["-O2", "-fno-exceptions", "--use-port=sdl3", "--use-port=emdawnwebgpu"]
c_flags = ["-O2", "--use-port=sdl3"]
defines = ["NDEBUG=1", "POCKET_WEB=1"]
link_flags = ["-O2", "--use-port=sdl3", "--use-port=emdawnwebgpu", "-sALLOW_MEMORY_GROWTH=1", "-sINITIAL_MEMORY=134217728", "-sSTACK_SIZE=4194304", "-sASYNCIFY=1", "-sASYNCIFY_STACK_SIZE=131072", "-sFORCE_FILESYSTEM=1", "-lidbfs.js", "-sEXPORTED_RUNTIME_METHODS=ccall,cwrap,UTF8ToString,stringToNewUTF8,FS,FS_createPath,FS_createDataFile,FS_createPreloadedFile,addRunDependency,removeRunDependency,HEAPF32,HEAPF64,HEAPU32,HEAPU8", "-sEXPORTED_FUNCTIONS=_main,_malloc,_free,_pocket_command,_pocket_command_async", "-sENVIRONMENT=web", "-sNO_EXIT_RUNTIME=1"]

# The same runtime with JavaScript Promise Integration instead of Asyncify: no instrumented code, so
# a smaller and faster module, for browsers that have JSPI (Chrome; docs/web.md). `pocket pack <name>
# --web --config wasm-jspi`.
[configs.wasm-jspi]
target = "wasm"
warnings = ["-Wall", "-Wextra", "-Wno-unused-parameter", "-Wno-missing-field-initializers"]
cxx_flags = ["-O2", "-fno-exceptions", "--use-port=sdl3", "--use-port=emdawnwebgpu"]
c_flags = ["-O2", "--use-port=sdl3"]
defines = ["NDEBUG=1", "POCKET_WEB=1"]
link_flags = ["-O2", "--use-port=sdl3", "--use-port=emdawnwebgpu", "-sALLOW_MEMORY_GROWTH=1", "-sINITIAL_MEMORY=134217728", "-sSTACK_SIZE=4194304", "-sJSPI=1", "-sJSPI_EXPORTS=main,pocket_command_async", "-sFORCE_FILESYSTEM=1", "-lidbfs.js", "-sEXPORTED_RUNTIME_METHODS=ccall,cwrap,UTF8ToString,stringToNewUTF8,FS,FS_createPath,FS_createDataFile,FS_createPreloadedFile,addRunDependency,removeRunDependency,HEAPF32,HEAPF64,HEAPU32,HEAPU8", "-sEXPORTED_FUNCTIONS=_main,_malloc,_free,_pocket_command,_pocket_command_async", "-sENVIRONMENT=web", "-sNO_EXIT_RUNTIME=1"]

# The smallest runtime: JSPI at -Oz with link-time optimization, a fifth smaller than wasm-jspi and
# about two fifths slower at stepping the simulation (docs/web.md, Costs). `pocket pack <name> --web --config wasm-small`.
[configs.wasm-small]
target = "wasm"
warnings = ["-Wall", "-Wextra", "-Wno-unused-parameter", "-Wno-missing-field-initializers"]
cxx_flags = ["-Oz", "-flto", "-fno-exceptions", "--use-port=sdl3", "--use-port=emdawnwebgpu"]
c_flags = ["-Oz", "-flto", "--use-port=sdl3"]
defines = ["NDEBUG=1", "POCKET_WEB=1"]
link_flags = ["-Oz", "-flto", "--use-port=sdl3", "--use-port=emdawnwebgpu", "-sALLOW_MEMORY_GROWTH=1", "-sINITIAL_MEMORY=134217728", "-sSTACK_SIZE=4194304", "-sJSPI=1", "-sJSPI_EXPORTS=main,pocket_command_async", "-sFORCE_FILESYSTEM=1", "-lidbfs.js", "-sEXPORTED_RUNTIME_METHODS=ccall,cwrap,UTF8ToString,stringToNewUTF8,FS,FS_createPath,FS_createDataFile,FS_createPreloadedFile,addRunDependency,removeRunDependency,HEAPF32,HEAPF64,HEAPU32,HEAPU8", "-sEXPORTED_FUNCTIONS=_main,_malloc,_free,_pocket_command,_pocket_command_async", "-sENVIRONMENT=web", "-sNO_EXIT_RUNTIME=1"]

[[dependencies]]
name = "sdl3"
version = "3.4.16"
kind = "cmake"
url = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz"
sha256 = "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68"
cmake_args = ["-DSDL_STATIC=ON", "-DSDL_SHARED=OFF", "-DSDL_TESTS=OFF", "-DSDL_EXAMPLES=OFF", "-DSDL_TEST_LIBRARY=OFF", "-DSDL_INSTALL_DOCS=OFF"]
include_dirs = ["include"]
libs = ["lib/libSDL3.a"]
wasm = "port"
frameworks = ["CoreMedia", "CoreVideo", "Cocoa", "IOKit", "ForceFeedback", "Carbon", "CoreAudio", "AudioToolbox", "AVFoundation", "Foundation", "GameController", "Metal", "QuartzCore"]
weak_frameworks = ["UniformTypeIdentifiers", "CoreHaptics"]
link_flags = ["-lpthread", "-lm"]
license = "Zlib"

[[dependencies]]
name = "wgpu"
version = "29.0.1.1"
kind = "prebuilt"
url = "https://github.com/gfx-rs/wgpu-native/releases/download/v29.0.1.1/wgpu-macos-aarch64-release.zip"
sha256 = "a5797a37b1adf720bcd5dcffb291edbbd5b7b14be0a3874c28e6393a655a7a3e"
strip_components = 0
include_dirs = ["include"]
libs = ["lib/libwgpu_native.a"]
wasm = "port"
frameworks = ["Metal", "QuartzCore", "CoreFoundation", "Foundation", "CoreGraphics", "IOKit", "IOSurface", "AppKit"]
license = "MIT OR Apache-2.0"

[[dependencies]]
name = "freetype"
version = "2.14.3"
kind = "cmake"
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz"
sha256 = "36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f"
cmake_args = ["-DBUILD_SHARED_LIBS=OFF", "-DFT_DISABLE_ZLIB=ON", "-DFT_DISABLE_BZIP2=ON", "-DFT_DISABLE_PNG=ON", "-DFT_DISABLE_HARFBUZZ=ON", "-DFT_DISABLE_BROTLI=ON", "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"]
include_dirs = ["include/freetype2"]
libs = ["lib/libfreetype.a"]
license = "FTL"

[[dependencies]]
name = "harfbuzz"
version = "12.3.0"
kind = "cmake"
url = "https://github.com/harfbuzz/harfbuzz/releases/download/12.3.0/harfbuzz-12.3.0.tar.xz"
sha256 = "8660ebd3c27d9407fc8433b5d172bafba5f0317cb0bb4339f28e5370c93d42b7"
cmake_args = ["-DBUILD_SHARED_LIBS=OFF", "-DHB_HAVE_FREETYPE=OFF", "-DHB_HAVE_GLIB=OFF", "-DHB_HAVE_ICU=OFF", "-DHB_HAVE_CORETEXT=OFF", "-DHB_BUILD_SUBSET=OFF", "-DHB_BUILD_UTILS=OFF", "-DHB_BUILD_TESTS=OFF", "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"]
include_dirs = ["include/harfbuzz"]
libs = ["lib/libharfbuzz.a"]
license = "MIT"

# The TypeScript compiler (TypeScript 7, native) for `pocket check`: not linked, only run.
[[dependencies]]
name = "typescript"
version = "7.0.2"
kind = "prebuilt"
url = "https://registry.npmjs.org/@typescript/typescript-darwin-arm64/-/typescript-darwin-arm64-7.0.2.tgz"
sha256 = "902e2fe1cf0799198ef902c6b8c310a450fef629a6baba41d45641ef75c04ebd"
strip_components = 1
wasm = "skip"
license = "Apache-2.0"

