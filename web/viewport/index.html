<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amoris Viewport</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #d8dde3; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; left: 12px; top: 10px; background: rgba(10,12,16,.72); padding: 8px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<script type="module">
// Modes: ?demo=cubes[&count=N][&dense] draws Bevy's many_cubes layouts in the browser;
// ?demo=mixed[&n=8] a grid of every mesh kind and pipeline variant under cascaded shadows;
// ?demo=occluders the occlusion culling check's scene (docs/spec/occlusion.md);
// ?occlusion=off|on|auto sets occlusion culling (auto by default);
// ?in_flight=N lets at most N frames be on the GPU (no limit by default; docs/bench/polish.md 3);
// ?render=ws://127.0.0.1:7878/render[&assets=http://127.0.0.1:7878/assets/] shows a host's world.
// ?gpu_minimal=first-instance (or features,limits) leaves device features out as
// POCKET_GPU_MINIMAL does natively: without indirect-first-instance the renderer takes WebGPU's
// baseline draw path.
import { createViewport } from "./viewport.js";
const q = new URLSearchParams(location.search);
const hud = document.getElementById("hud");
const canvas = document.getElementById("c");
const dense = q.has("dense");
try {
  const vp = await createViewport(canvas, {
    renderUrl: q.get("render") || undefined,
    assetsUrl: q.get("assets") || "/assets/",
    gpuMinimal: q.get("gpu_minimal") || undefined,
    beforeFrame: (api, frame) => { if (q.get("demo") === "cubes") api.demoCubesCamera(frame, dense); },
  });
  if (q.get("demo") === "cubes") vp.demoCubes(Number(q.get("count") || 1600000), dense);
  if (q.get("demo") === "mixed") vp.demoMixed(Number(q.get("n") || 8));
  if (q.get("demo") === "occluders") vp.demoOccluders();
  if (q.get("occlusion")) vp.setOcclusion(q.get("occlusion"));
  if (q.has("in_flight")) vp.raw.set_max_frames_in_flight(Number(q.get("in_flight")));
  if (q.has("grid") || q.has("axes")) vp.raw.set_overlays(q.has("grid"), q.has("axes"));
  if (q.get("eye")) {
    const e = q.get("eye").split(",").map(Number), t = (q.get("target") || "0,0,0").split(",").map(Number);
    vp.raw.set_camera_look(e[0], e[1], e[2], t[0], t[1], t[2], 0, 1, 0, 50, 0.1, 0);
  }
  window.pocketViewport = vp;
  const samples = [];
  vp.onStats((s) => {
    samples.push(s);
    if (samples.length > 600) samples.shift();
    window.pocketStats = s;
    hud.textContent = `${s.backend}  ${canvas.width}x${canvas.height}  draws: ${s.draw_path} (${s.draw_calls})  occlusion: ${s.occlusion}\nframe ${s.frame_ms.toFixed(2)} ms   gpu ${s.gpu_ms.toFixed(2)} ms\ninstances ${s.instances}  tick ${s.tick}\n` +
      (s.passes || []).map((p) => `  ${p.pass.padEnd(12)} ${p.ms.toFixed(2)} ms`).join("\n");
  });
  window.pocketSamples = samples;
} catch (e) {
  hud.textContent = "error: " + e.message;
  console.error(e);
}
</script>
</body>
</html>
