{% extends "base.html" %}
{% block site_meta %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ config.site_description }}">
<meta name="theme-color" content="#17191d">
<link rel="icon" href="{{ base_url }}/../assets/icon.png">
{% if page and page.canonical_url %}<link rel="canonical" href="{{ page.canonical_url }}">{% endif %}
{% endblock %}
{% block extrahead %}
<!-- MkDocs 1.6.1's fixed-dark script expects these stylesheet handles even
     when Highlight.js is disabled. Code blocks use the canonical site.css. -->
<style id="hljs-light" disabled></style>
<style id="hljs-dark"></style>
{% endblock %}
{% block site_name %}
<a class="navbar-brand" href="{{ base_url }}/../"><img src="{{ base_url }}/../assets/icon.png" width="28" height="28" alt="" style="display:inline-block;vertical-align:middle;image-rendering:pixelated;margin-right:8px">Amoris</a>
<span style="font-size:12px;color:#aeb6c1;margin-right:18px">Documentation</span>
{% endblock %}
