[package]
name = "pocket"
version = "0.0.1"
edition = "2021"
description = "The Pocket3D build tool: manifests, module graph, Ninja generation, dependency fetching, TypeScript bundling, and agent-facing JSON commands."
license = "MIT OR Apache-2.0"

[[bin]]
name = "pocket"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
walkdir = "2"
globset = "0.4"
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
indexmap = { version = "2", features = ["serde"] }
oxc = { version = "0.150", features = ["transformer", "codegen", "semantic", "ast_visit"] }
# Canonical paths without the verbatim prefix Windows' canonicalize adds (//?/C:/...), which other
# programs and relative paths do not take.
dunce = "1"

[profile.release]
opt-level = 2
debug = 1
