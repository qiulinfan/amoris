<!doctype html>
<meta charset="utf-8">
<title>splat tiles in the browser</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; width: 1280px; height: 720px; }</style>
<canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import init, { App } from './pkg/splatweb.js';
window.phase = 'loading';
window.logs = [];
const origLog = console.log;
console.log = (...a) => { window.logs.push(a.join(' ')); origLog(...a); };
console.error = (...a) => { window.logs.push('ERROR ' + a.join(' ')); };
const frames = (app, n) => new Promise((done) => {
  let i = 0, last = '';
  const step = (t) => {
    last = app.render(t);
    if (++i < n) requestAnimationFrame(step); else done(last);
  };
  requestAnimationFrame(step);
});
try {
  await init();
  const app = await App.create(document.getElementById('c'), Number(new URLSearchParams(location.search).get('n') || 200000));
  window.quads = await frames(app, 90);
  window.phase = 'quads';
  window.next = async () => {
    app.set_tiles(true);
    window.tiles = await frames(app, 90);
    window.phase = 'tiles';
  };
} catch (e) {
  window.phase = 'failed: ' + e;
}
</script>
