# The `lint-fixture` control (docs/spec/checks.md 8.6; simulation.md 12, item 8): a crate outside the
# workspace that uses every entry of tools/clippy-determinism.toml. `cargo xtask check`'s clippy step
# lints it with its generated clippy.toml and fails unless clippy reports each entry, so a path that
# stops resolving after a dependency update cannot pass silently.
[package]
name = "lint-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

# Its own workspace: not a member of the repository's, and never built by it.
[workspace]

[dependencies]
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std"] }
bevy_platform = { version = "=0.19.1", default-features = false, features = ["std"] }
hashbrown = "=0.16.1"
