# The crate graph of docs/spec/architecture.md 5, checked by `cargo xtask check`'s `deps` step
# against `cargo metadata` for the host and for wasm32-unknown-unknown (docs/spec/checks.md 5.2).
# A new crate or a new edge changes architecture.md 5 and this file together.
#
# deps:    the workspace crates a crate may depend on, for normal, dev and build dependencies alike
#          (a test may use a crate below its own, never one above).
# web:     the crate builds for wasm32-unknown-unknown (clippy and the wasm step check it there).
# any:     every crate may depend on it (amoris-contract, architecture.md 4.16).
# planned: in architecture.md 5 but not created yet, so its absence is not deps.crate_missing.

[crate.amoris-contract]
group = "contract"
deps = []
web = true
any = true

[crate.amoris-sim]
group = "game"
deps = []
web = true

[crate.amoris-assets]
group = "game"
deps = ["amoris-sim"]
web = true

[crate.amoris-persist]
group = "game"
deps = ["amoris-sim"]
web = true

[crate.amoris-physics]
group = "game"
deps = ["amoris-sim", "amoris-assets"]
web = true

[crate.amoris-interface]
group = "game"
deps = ["amoris-sim", "amoris-physics"]
web = true

[crate.amoris-script]
group = "game"
deps = ["amoris-sim", "amoris-assets", "amoris-physics", "amoris-interface"]
web = true

[crate.amoris-link]
group = "link"
deps = ["amoris-sim", "amoris-persist"]
web = true

[crate.amoris-runtime]
group = "game"
deps = ["amoris-sim", "amoris-assets", "amoris-persist", "amoris-physics", "amoris-interface",
        "amoris-script", "amoris-link"]
web = true

[crate.amoris-check]
group = "game"
deps = ["amoris-sim", "amoris-persist", "amoris-runtime", "amoris-link"]
web = true

[crate.amoris-render]
group = "presenter"
deps = ["amoris-assets"]
web = true

[crate.amoris-audio]
group = "presenter"
deps = ["amoris-assets"]
web = true

[crate.amoris-viewport]
group = "presenter"
deps = ["amoris-assets", "amoris-render", "amoris-audio"]
web = true

[crate.amoris-mcp]
group = "tool"
deps = ["amoris-sim", "amoris-link"]
web = false

[crate.amoris-server]
group = "tool"
deps = ["amoris-sim", "amoris-link", "amoris-mcp"]
web = false

[crate.amoris-debug]
group = "tool"
deps = ["amoris-script", "amoris-link"]
web = false

[crate.amoris-app]
group = "app"
deps = ["amoris-sim", "amoris-link", "amoris-runtime", "amoris-check", "amoris-render", "amoris-assets",
        "amoris-mcp", "amoris-server", "amoris-debug", "amoris-audio"]
web = false

[crate.amoris-web]
group = "app"
deps = ["amoris-sim", "amoris-link", "amoris-runtime", "amoris-check", "amoris-render", "amoris-assets"]
web = true

[crate.xtask]
group = "tool"
deps = []
web = false

# Forbidden anywhere in the transitive normal dependencies of the group's crates, on any target
# (architecture.md 2.1 and 6). wasm-bindgen and js-sys appear below amoris-sim on wasm32 through
# bevy_ecs's bevy_tasks, so they are forbidden only as direct dependencies.
[group.game]
forbid = ["wgpu", "winit", "egui", "egui-wgpu", "egui-winit", "tokio", "rmcp", "rayon", "web-sys"]
forbid_direct = ["wasm-bindgen", "js-sys"]

[features.bevy_ecs]
forbid = ["multi_threaded", "serialize"]          # persistence.md 12, P6

[features.serde_json]
require = ["float_roundtrip"]
forbid = ["preserve_order"]                       # replay.md 2.1

[features.rapier3d]
require = ["enhanced-determinism", "serde-serialize"]   # architecture.md 6; the physics spike
forbid = ["parallel", "simd8"]

[features.rquickjs]
forbid = ["parallel"]     # it implements Send by pulling tokio/rt-multi-thread (architecture.md 4.6)

[build]
cflags_must_contain = "-ffp-contract=off"
rustflags_forbid = ["target-cpu", "+fma"]
