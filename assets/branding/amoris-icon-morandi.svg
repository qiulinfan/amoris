<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Amoris Morandi color icon</title>
  <desc id="description">Owner-approved three-point geometry with soft Morandi gradients in its left, right and lower sandbox regions. Black letter and frame are unchanged; the seed-shaped counter remains white. Transparent outside the frame.</desc>
  <defs>
    <linearGradient id="morandi-sage" gradientUnits="userSpaceOnUse" x1="100" y1="100" x2="924" y2="924">
      <stop offset="0" stop-color="#D2D8CF"/><stop offset="0.5" stop-color="#BBC5B9"/><stop offset="1" stop-color="#A6B2A3"/>
    </linearGradient>
