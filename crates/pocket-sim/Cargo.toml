[package]
name = "pocket-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The simulation core: the tick, entity ids, events, the RNG and the deterministic math library"

[features]
# The boundary invariants' walk of the entity index (docs/spec/simulation.md 4.1; architecture.md
# 7.4): on in this crate's unit tests always, elsewhere with `--features pocket-sim/invariants`
# (the check's test and debug cross-build runs).
invariants = []

[dependencies]
pocket-contract.workspace = true
bevy_ecs.workspace = true
libm.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# Persisted::trace takes serde-reflection's Tracer (persistence.md 6.2), declared here so physics
# and scripts register state without depending on pocket-persist (architecture.md 6).
serde-reflection.workspace = true
# ContentHash (persistence.md 5.1 and 6.1; architecture.md 6).
blake3.workspace = true

# A small wasm32 program that prints the web tests' results (math vectors, RNG vectors), run under
# Node by tests/web/run.mjs so they are checked identical natively and in WebAssembly.
[[example]]
name = "web_vectors"
crate-type = ["cdylib"]
