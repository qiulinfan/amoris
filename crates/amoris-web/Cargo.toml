[package]
name = "amoris-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The browser entry points: the game in a Web Worker and the page's presenter"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amoris-contract.workspace = true
amoris-sim.workspace = true
amoris-link.workspace = true
amoris-runtime.workspace = true
amoris-assets.workspace = true
amoris-check.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# The exports of both roles and the injected clock, performance.now() (architecture.md 4.14).
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
amoris-render.workspace = true
wgpu.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
# examples/pack.rs compiles a project's TypeScript natively into the web package, and the tests
# build projects from disk; the shipped module never links oxc (architecture.md 8.3).
amoris-runtime = { workspace = true, features = ["transpile"] }
amoris-check = { workspace = true, features = ["native"] }

# The engine source hash of crates/engine_version.rs, shared with amoris-app (versions.md 3.1, V9).
[build-dependencies]
blake3.workspace = true
