[package]
name = "pocket-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The wgpu renderer: GPU-driven, clustered PBR, shadows, sky, ocean, post; Metal, Vulkan and WebGPU"

[dependencies]
pocket-assets.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
log = "0.4"
fontdue = "0.9"
serde.workspace = true
serde_json.workspace = true
winit = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
image.workspace = true

[features]
import = ["pocket-assets/import"]
default = ["window", "import"]
# A native window runner (winit) for examples and the `pocket` binary.
window = ["dep:winit"]

[dev-dependencies]
pollster.workspace = true
wgpu.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
