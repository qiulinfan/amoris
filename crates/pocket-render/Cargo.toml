[package]
name = "pocket-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The wgpu renderer: GPU-driven, clustered PBR, shadows, sky, ocean, post; Metal, Vulkan and WebGPU"

[dependencies]
# `lod`: the primitives' levels of detail (docs/spec/lod.md).
pocket-assets = { workspace = true, features = ["lod"] }
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
log = "0.4"
fontdue = "0.9"
serde.workspace = true
serde_json.workspace = true
winit = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
image.workspace = true
# RenderDoc's in-application API for one-frame captures (renderdoc.rs); both already come with
# wgpu-hal.
libloading = "0.8"
renderdoc-sys = "1"

[features]
import = ["pocket-assets/import"]
default = ["window", "import"]
# A native window runner (winit) for examples and the `pocket` binary.
window = ["dep:winit"]

[dev-dependencies]
# What naga writes for each backend (shaders.rs tests: the forward shader's invariant positions);
# the version wgpu 30.0.1 resolves, with every backend's output.
naga = { version = "=30.0.1", features = ["wgsl-in", "hlsl-out", "spv-out", "msl-out"] }
pollster.workspace = true
intel_tex_2.workspace = true
texture2ddecoder.workspace = true
wgpu.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
