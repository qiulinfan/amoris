[package]
name = "pocket-viewport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The renderer in the browser (WebGPU): the editor's viewport and spectator pages, fed by the host's render feed"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pocket-assets = { workspace = true, features = ["import"] }
pocket-render = { workspace = true, features = ["import"] }
wgpu.workspace = true
glam.workspace = true
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "console"] }
