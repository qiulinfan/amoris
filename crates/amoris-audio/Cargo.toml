[package]
name = "amoris-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Audio presentation: kira playback of the world's sound sources and of sound events, with synthesized sfx presets and water sound"

[dependencies]
amoris-assets.workspace = true
kira = { workspace = true, optional = true }
glam = { workspace = true, features = ["mint"] }
log = "0.4"

[features]
# kira playback (`Audio`); without it the crate is the synthesis alone, which the browser
# viewport builds.
playback = ["dep:kira"]
