name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tools
        run: brew install ninja cmake
      - name: Cache dependencies and cargo
        uses: actions/cache@v4
        with:
          path: |
            .pocket/deps
            .pocket/cache
            tools/pocket/target
            ~/.cargo/registry
          key: ${{ runner.os }}-pocket-${{ hashFiles('pocket.toml', 'tools/pocket/Cargo.lock') }}
      - name: Bootstrap
        run: ./scripts/bootstrap.sh
      - name: Generated code is current
        run: ./.pocket/pocket gen --check
      - name: Build
        run: ./.pocket/pocket build --json > build-report.json; python3 -c "import json;d=json.load(open('build-report.json'));print(d['summary']);raise SystemExit(0 if d['ok'] else 1)"
      - name: Test
        run: ./.pocket/pocket test --json > test-report.json; python3 -c "import json;d=json.load(open('test-report.json'));print(d['summary']);[print(r['module'],r['ok']) for r in d['data']['results']];raise SystemExit(0 if d['ok'] else 1)"
      - name: Headless samples
        run: |
          ./.pocket/pocket run hello -- --headless --frames 120 --json --capture hello.png > hello.json
          ./.pocket/pocket run playground -- --headless --frames 240 --json --capture playground.png > playground.json
          ./.pocket/pocket run physics -- --headless --frames 300 --json --capture physics.png > physics.json
          ./.pocket/pocket run ui -- --headless --frames 60 --json --capture ui.png > ui.json
          ./.pocket/pocket run assets -- --headless --frames 60 --json --capture assets.png > assets.json
      - name: Pack runs standalone
        run: |
          ./.pocket/pocket pack assets --config debug --zip --json > pack.json
          python3 -c "import json;d=json.load(open('pack.json'));print(d['summary']);raise SystemExit(0 if d['ok'] else 1)"
          ./dist/assets/assets --headless --frames 30 --json --capture packed.png > packed.json
          python3 -c "import json;d=json.load(open('packed.json'));print('packed run ok', d['ok'], d['render']);raise SystemExit(0 if d['ok'] and d['render']['assets']['meshes'] == 2 else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-captures
          path: |
            build-report.json
            test-report.json
            hello.json
            playground.json
            physics.json
            ui.json
            assets.json
            pack.json
            packed.json
            *.png

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake python3 python3-pip && python3 -m pip install --break-system-packages fonttools
      - name: Cache emsdk, dependencies and cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.pocket-tools/emsdk
            .pocket/deps
            .pocket/cache
            tools/pocket/target
            ~/.cargo/registry
          key: ${{ runner.os }}-pocket-web-6.0.9-${{ hashFiles('pocket.toml', 'tools/pocket/Cargo.lock') }}
      - name: Emscripten 6.0.9
        run: |
          if [ ! -x "$HOME/.pocket-tools/emsdk/upstream/emscripten/em++" ]; then
            mkdir -p "$HOME/.pocket-tools"
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/.pocket-tools/emsdk"
            cd "$HOME/.pocket-tools/emsdk" && ./emsdk install 6.0.9 && ./emsdk activate 6.0.9
          fi
      - name: Build the tool
        run: |
          cargo build --release --manifest-path tools/pocket/Cargo.toml
          mkdir -p .pocket && cp tools/pocket/target/release/pocket .pocket/pocket
      - name: Dependencies for wasm
        run: ./.pocket/pocket setup --target wasm --json > setup-wasm.json; python3 -c "import json;d=json.load(open('setup-wasm.json'));print(d['summary']);raise SystemExit(0 if d['ok'] else 1)"
      - name: Pack hello for the web, with the editor
        run: ./.pocket/pocket pack hello --web --editor --json > pack-web.json; python3 -c "import json;d=json.load(open('pack-web.json'));print(d['summary']);raise SystemExit(0 if d['ok'] else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-pack
          path: |
            setup-wasm.json
            pack-web.json
            dist/web/hello/index.html
