name: Amoris showcase and documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - samples/windward/**
      - samples/emberlight/**
      - web/**
      - crates/**
      - Cargo.lock
      - tools/site/build_site.py
      - tools/site/check_site.py
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: amoris-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AMORIS_LLVM: /usr
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r site/requirements.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang llvm lld binaryen
      - run: rustup show
      - name: Install the matching WebAssembly binding generator
        run: |
          version=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Export the playable Wind Road
        run: cargo xtask export-web samples/windward --out out/windward-web
      - name: Export playable Emberlight
        run: cargo xtask export-web samples/emberlight --out out/emberlight-web
      - uses: actions/configure-pages@v6.0.0
      - run: python tools/site/build_site.py
      - run: python tools/site/check_site.py --links-only
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
